name: Go
on:
  push:
    paths:
      - "watchdog/**"
      - "agent/loop.py"
      - "agent/restore.py"
      - "agent/safe_io.py"
      - "protocol/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "watchdog/**"
      - "agent/loop.py"
      - "agent/restore.py"
      - "agent/safe_io.py"
      - "protocol/**"
      - ".github/workflows/go.yml"
  # Manual run for a specific commit, e.g. to confirm a merge commit on main.
  workflow_dispatch:

# Own CI track for the watchdog (section 18.3, conditions): "the existing
# Python track stays as it is." Therefore runs independently of ci.yml, with
# its own Go toolchain instead of a Python environment.
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchdog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          # go.mod has no dependencies (section 18.3) -- the module cache
          # exists only for completeness.
          cache-dependency-path: watchdog/go.mod
      - run: go vet ./...
      - run: go test ./... -v

  # Statically built (CGO_ENABLED=0), one binary each for arm64 and amd64,
  # with a checksum -- exactly the condition from section 18.3. Nothing is
  # compiled on the device; these files are what later goes into the
  # prepared image (image/) (section 19.3, 19.4). thermoctl-leds (P5.7,
  # section 23, "Decided afterward") and thermoctl-restore-mover (P5.5c,
  # section 15.3's second "Decided afterward" paragraph) are built the
  # same way, from the same go.mod, as two further binaries -- both live
  # in the same module but are not part of the watchdog's own
  # 300-line budget (docs/STATUS.md's P5.7/P5.5c entries).
  build:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        arch: [amd64, arm64]
    defaults:
      run:
        working-directory: watchdog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: watchdog/go.mod
      - env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -o thermoctl-watchdog-${{ matrix.arch }} .
      - env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -o thermoctl-leds-${{ matrix.arch }} ./cmd/thermoctl-leds
      - env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -o thermoctl-restore-mover-${{ matrix.arch }} ./cmd/thermoctl-restore-mover
      - run: sha256sum thermoctl-watchdog-${{ matrix.arch }} > thermoctl-watchdog-${{ matrix.arch }}.sha256
      - run: sha256sum thermoctl-leds-${{ matrix.arch }} > thermoctl-leds-${{ matrix.arch }}.sha256
      - run: sha256sum thermoctl-restore-mover-${{ matrix.arch }} > thermoctl-restore-mover-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: thermoctl-watchdog-${{ matrix.arch }}
          path: |
            watchdog/thermoctl-watchdog-${{ matrix.arch }}
            watchdog/thermoctl-watchdog-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: thermoctl-leds-${{ matrix.arch }}
          path: |
            watchdog/thermoctl-leds-${{ matrix.arch }}
            watchdog/thermoctl-leds-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: thermoctl-restore-mover-${{ matrix.arch }}
          path: |
            watchdog/thermoctl-restore-mover-${{ matrix.arch }}
            watchdog/thermoctl-restore-mover-${{ matrix.arch }}.sha256

  # The cross-language contract test from section 18.3: Python writes the
  # state file (with the same code that later runs on the device --
  # agent.loop.report_watchdog_state), the built watchdog reads it in check
  # mode. See watchdog/check_contract.sh for the detailed sequence and its
  # comment for the reasoning why this is its own job and not pytest or
  # go test alone. Extended for P5.7: the script also builds
  # cmd/thermoctl-leds and checks its reading of the new agent-written
  # status file (agent.loop.report_led_status) the same way. Extended
  # again for P5.5c: a full round trip -- Python stages a real restore via
  # agent.restore's own manifest writer, cmd/thermoctl-restore-mover
  # validates and moves it, Python reads its status file back via
  # agent.restore._check_and_report_mover_status.
  contract-test:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: watchdog/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Only pydantic -- protocol/ (imported by agent/loop.py) needs nothing
      # further, and the watchdog itself is unaffected by it.
      # The `agent` extra, not just pydantic: agent/loop.py imports httpx at
      # module level since P5.2 (the command loop), and the contract test
      # imports report_* from that module.
      - run: pip install -e ".[agent]"
      - run: bash watchdog/check_contract.sh
