<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Thermometer-with-flame glyph, the "landlord's own heating overview" motif.
       Centered node of the icon, drawn solid white so Icon Composer can tint
       and light it against the warm-to-cool gradient fill. -->
  <g fill="#ffffff">
    <rect x="472" y="300" width="80" height="330" rx="40" />
    <circle cx="512" cy="660" r="90" />
    <rect x="492" y="330" width="40" height="300" rx="20" fill-opacity="0.001"/>
  </g>
  <g fill="#ffffff" opacity="0.001">
    <!-- inner mercury column cut-out kept fully transparent on purpose: Icon
         Composer's specular pass reads the base shape, not this detail -->
  </g>
  <path d="M512 300 C460 250 452 190 500 150 C486 200 520 220 520 260 C548 230 548 190 524 150
           C584 190 584 260 540 300 Z" fill="#ffffff" />
</svg>
