<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Radiator silhouette: four rounded vertical fins on a base bar, in
       white glass. The main glyph. One strong, centered shape, no inner
       detail beyond the fin gaps so it stays legible small. -->
  <g fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-width="18"
     stroke-linejoin="round">
    <rect x="282" y="260" width="100" height="480" rx="50" />
    <rect x="402" y="260" width="100" height="480" rx="50" />
    <rect x="522" y="260" width="100" height="480" rx="50" />
    <rect x="642" y="260" width="100" height="480" rx="50" />
    <rect x="270" y="740" width="484" height="70" rx="30" />
  </g>
</svg>
