# Overrides mkosi's own built-in default `00-esp.conf` (section 19,
# "the amd64 boot-path gap" -- image/README.md's own "Boot partition path"
# section has the full reasoning). Providing ANY file under mkosi.repart/
# makes mkosi stop auto-generating its defaults entirely (mkosi's own
# documentation, "SCRIPTS"/"Partition definition files" section), so
# 10-root.conf (next to this file) has to be carried forward unchanged too,
# not just this file.
#
# Two changes from mkosi's own default `00-esp.conf`:
#
# 1. `Label=ESP` -- pins the GPT partition label instead of leaving it at
#    mkosi's own type-derived default. This repository's own static
#    `/etc/fstab` line (written by `mkosi.postinst.chroot`, next to this
#    file) mounts this partition by `PARTLABEL=ESP`, which only works if
#    the label is a known, fixed string rather than whatever mkosi would
#    otherwise pick.
# 2. `CopyFiles=/boot/firmware:/` instead of the default `CopyFiles=/boot:/`
#    -- the default copies the *entire* rootfs `/boot` hierarchy (kernel,
#    initrd, and this repository's own `/boot/firmware/...` files
#    `image/common/install.sh` places during the build) into the ESP's
#    root, which would nest our own files one level too deep (ESP:/firmware
#    /thermoctl/... instead of ESP:/thermoctl/...) once this same partition
#    is mounted back at /boot/firmware at runtime (see the `/etc/fstab`
#    line below). Copying only the `/boot/firmware` subtree instead makes
#    the round trip exact: whatever `install.sh` placed under
#    rootfs-build-time `/boot/firmware/` lands at the ESP's own root, the
#    same place Raspberry Pi OS's `/boot/firmware` boot partition already
#    puts it -- no amd64-specific path ever has to appear in
#    `image/common/agent-compose.yml`, `agent/registration.py`,
#    `agent/encryption.py`, or `tools/flash_image.py`. The kernel/initrd
#    fallback copy the default provides is not needed here: this image
#    boots exclusively via `Bootloader=systemd-boot` UKIs (no
#    `BiosBootloader=`), which live under `/efi` during the build (see
#    `CopyFiles=/efi:/` below, unchanged from mkosi's own default).
[Partition]
Type=esp
Format=vfat
Label=ESP
CopyFiles=/boot/firmware:/
CopyFiles=/efi:/
SizeMinBytes=512M
SizeMaxBytes=512M
