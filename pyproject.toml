[project]
name = "thermoctl-fleet"
version = "0.1.0"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# The shared contract (protocol/) only needs Pydantic and is therefore included
# in both images (fleet, agent) without either pulling in the other's extra.
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Cloud side: FastAPI application, SSE output.
fleet = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    # Storage layer (P1.3): SQLAlchemy + Alembic migrations, cloud side only --
    # the agent image must not pull these in, hence the `fleet` extra and not
    # a base dependency.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Absence alarming (P2.2, section 8): the generic webhook notifier. SMTP
    # notification uses stdlib `smtplib`, no extra dependency needed for it.
    "httpx>=0.27",
    # Fleet UI login (P3.0): Argon2 password hashing, TOTP second factor,
    # server-rendered templates, and form parsing for FastAPI.
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    # Passkeys / WebAuthn as a second factor alternative to TOTP (P6.2,
    # `docs/specification.md` section 12 "Decided afterward") -- a
    # maintained library (`py_webauthn`, PyPI name `webauthn`) does the
    # actual registration/authentication ceremony verification (CBOR
    # attestation/assertion parsing, COSE key handling, signature
    # checking); see `fleet/webauthn_auth.py`. Never used to generate or
    # hold a private key in the cloud (CLAUDE.md security principle 3) --
    # the private half of every passkey stays on the authenticator.
    "webauthn>=3.0.1,<4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Device registration (P4.2b, sections 4/14/15.3): validating a device's
    # Ed25519 **public** key and verifying its signature over the token
    # challenge. Never used to *generate* or hold a private key in the cloud
    # (CLAUDE.md security principle 3) -- that only ever happens in `agent/`
    # (future P2.3), on the base station.
    "cryptography>=43",
    # Structural validation of age recipients/key blocks (P5.5b, section
    # 15.2/15.3's "Decided afterward" paragraph) -- `fleet.age_key_block`
    # parses a submitted recipient string and checks a restore key block's
    # header shape via the real `pyrage.x25519.Recipient.from_str`, never
    # a hand-rolled bech32/age parser (CLAUDE.md: "no invented
    # functionality" for cryptographic code, same reasoning as `agent
    # .encryption`'s own P5.5a dependency below). The fleet never holds a
    # private key or decrypts anything with this library -- only
    # `pyrage.x25519.Recipient.from_str`'s parsing/validation is ever
    # called from `fleet/`.
    "pyrage>=1.4",
]
# Device side: HTTP client for heartbeat/events, SSE client for the
# command channel.
agent = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    # P5.0 (sections 4, 14, 15.3): certificate-pinning transport
    # (`agent/transport.py`) imports `httpcore` directly to reach the one
    # constructor parameter (`network_backend=`) `httpx.HTTPTransport`
    # itself does not expose -- previously only a transitive dependency of
    # httpx, now declared explicitly since agent code imports it by name.
    "httpcore>=1.0",
    # Ed25519 key generation and signing for device registration
    # (`agent/registration.py`) -- generated and kept on the device, never
    # transmitted (CLAUDE.md security principle 3). The fleet side already
    # depends on `cryptography` (P4.2b, above) for the verifying half of
    # this same exchange.
    "cryptography>=43",
    # Real `age` file format encryption for operational-data backups
    # (P5.5a, sections 15.1/15.3, security principle 4) -- Python bindings
    # to the Rust `age`/`rage` implementation, not a hand-rolled format or
    # cryptographic primitive (CLAUDE.md: "no invented functionality"
    # applies doubly hard to cryptography). See `agent/encryption.py`.
    "pyrage>=1.4",
]
flash = ["textual>=8.2.8,<9"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    # For FastAPI's TestClient -- not "httpx": for Python 3.14, httpx2 is the
    # recommended replacement, see starlette.testclient's warning about httpx.
    "httpx2>=2.12",
    "ruff>=0.16",
    "mypy>=1.18",
    # Local SMTP server for testing the SMTP notifier (P2.2) against a real
    # receiver -- no mocks, per CLAUDE.md's testing method.
    "aiosmtpd>=1.4",
    # P6.2 tests build a real, minimal software WebAuthn authenticator
    # (`tests/webauthn_fixtures.py`) to exercise `py_webauthn`'s actual
    # verification code end to end ("no mocking of verification") --
    # `cbor2` is what encodes its CBOR `attestationObject`. Already an
    # installed transitive dependency of `webauthn` itself; pinned here
    # explicitly so the test suite does not rely on that remaining true.
    "cbor2>=5.6",
    # P3.0's packaging test (tests/test_packaging.py) builds a real wheel
    # with `pip wheel --no-build-isolation` to prove the UI templates are
    # actually included -- that needs the build backend itself present in
    # this environment, not just declared in `[build-system]` (which only
    # pip's own *isolated* build env would install automatically).
    "setuptools>=77",
    "wheel>=0.43",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# watchdog/ is deliberately NOT listed here: since section 18.3 it is a
# standalone Go module (watchdog/go.mod), not a Python package -- see
# watchdog/README.md. tools* is pure build/CI tooling (image/ configuration
# check) and does not go into any Docker image.
# fleet.migrations* (P1.3) matches "fleet*" and is picked up automatically --
# it is a proper package (has __init__.py, see fleet/migrations/__init__.py
# and fleet/migrations/versions/__init__.py), so the Alembic scripts land in
# the fleet Docker image without a separate package-data entry.
include = ["protocol*", "fleet*", "agent*", "tools*"]

[tool.setuptools.package-data]
# P3.0: Jinja2 templates for the fleet UI ship inside the `fleet` package
# itself (not read from the repository checkout at runtime), so they must be
# listed explicitly -- `packages.find` above only picks up `.py` files.
# `docker/Dockerfile.fleet` only `COPY`s `fleet/`, so anything the running
# service needs must be inside this package, not alongside it.
fleet = ["templates/ui/*.html", "static/ui/*.css"]

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert is welcome in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# `pyrage` (P5.5a, `agent/encryption.py`) is a compiled Rust extension
# (PyO3) shipping no `py.typed`/stub package -- unlike every other
# dependency this project pins, there is no upstream stub to install
# instead of ignoring it here.
module = ["pyrage", "pyrage.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `tools/docs_screenshots.py` only: Playwright and Pillow are installed ad
# hoc to regenerate the website screenshots, not project dependencies --
# CI and a plain dev install do not have them.
module = ["playwright", "playwright.*", "PIL", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=protocol --cov=fleet --cov=agent --cov=tools --cov-report=term-missing"
