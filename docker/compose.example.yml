# Example interplay of both images. Not a single credential is in this
# file -- credentials come from .env, which does not belong in the
# repository (see docs/specification.md section 4).
#
# This example shows only the rough topology and is not a rollout recipe
# for multiple apartments: the agent actually runs on each apartment's base
# station, not next to the fleet service.

services:
  fleet:
    build:
      context: ..
      dockerfile: docker/Dockerfile.fleet
    # image: ghcr.io/magicalwig34653/thermoctl-fleet:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  # Illustration only -- actually runs on the apartment's base station,
  # not here next to the fleet service.
  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    # image: ghcr.io/magicalwig34653/thermoctl-agent:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      fleet:
        condition: service_healthy
