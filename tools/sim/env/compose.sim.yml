# Fleet and the ten container agents (sim-a03..sim-a12) of the usage simulation.
# sim-a01/a02 are reserved for the Lima VMs and have no service here.
# Started by `python -m tools.sim.env.up_fleet`, which exports the SIM_* variables.
# Every resource name starts with `thermoctl-sim`; nothing else is touched.
name: thermoctl-sim

# Shared by every agent service. Each service adds only its own container_name, command
# and mounts. No ports, no docker.sock, no privileged; the agent sees ONLY its own token
# file and the (non-secret) fault directory plus the shared clock directory.
x-sim-agent: &sim-agent
  image: thermoctl-sim-fleet:local
  user: "${SIM_UID:?set by up_fleet}:${SIM_GID:?set by up_fleet}"
  pull_policy: never   # built by the fleet service; never pulled
  restart: unless-stopped
  working_dir: /app
  depends_on:
    fleet:
      condition: service_healthy
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    SIM_ALLOWED_HOSTS: fleet
    LD_PRELOAD: /usr/local/lib/libfaketime.so.1
    FAKETIME_TIMESTAMP_FILE: /sim-clock/clock
    FAKETIME_NO_CACHE: "1"
  networks: [sim-net]

services:
  fleet:
    container_name: thermoctl-sim-fleet
    image: thermoctl-sim-fleet:local
    build:
      context: ../../..
      dockerfile: tools/sim/env/Dockerfile.fleet-sim
      args:
        BASE_IMAGE: thermoctl-sim-fleet-base:local
    # Run as the host user so the host can seed the same SQLite file.
    user: "${SIM_UID:?set by up_fleet}:${SIM_GID:?set by up_fleet}"
    ports:
      - "127.0.0.1:8200:8000"
    environment:
      FLEET_DATABASE_URL: "sqlite:////data/fleet.db"
      FLEET_TOTP_KEY: "${SIM_TOTP_KEY:?set by up_fleet}"
      FLEET_BACKUP_STORAGE_DIR: /backups
      FLEET_DIAGNOSTIC_BUNDLE_STORAGE_DIR: /bundles
      FLEET_PUBLIC_URL: "http://127.0.0.1:8200"
      FLEET_CERT_FINGERPRINT: "none-sim-plain-http"
      FLEET_WEBAUTHN_RP_ID: localhost
      FLEET_WEBAUTHN_ORIGIN: "http://localhost:8200"
      FLEET_ALARM_CHECK_INTERVAL_S: "2"
      FLEET_ROLLOUT_WORKER_INTERVAL_S: "10"
      FLEET_RETENTION_INTERVAL_S: "300"
      FLEET_BACKUP_RETENTION_INTERVAL_S: "300"
      FLEET_LOG_RETENTION_CHECK_INTERVAL_S: "300"
      FLEET_DIAGNOSTIC_BUNDLE_RETENTION_CHECK_INTERVAL_S: "300"
      # Virtual clock: absolute timestamp file without "@" freezes time until rewritten.
      LD_PRELOAD: /usr/local/lib/libfaketime.so.1
      FAKETIME_TIMESTAMP_FILE: /sim-clock/clock
      FAKETIME_NO_CACHE: "1"
    volumes:
      - "${SIM_STATE_DIR:?set by up_fleet}/fleet-data:/data"
      - "${SIM_STATE_DIR}/backups:/backups"
      - "${SIM_STATE_DIR}/diagnostic-bundles:/bundles"
      # The directory, not the file: SimClock replaces the file by rename, which a
      # single-file bind mount would never see.
      # Only this directory: users.json, totp.key and registrations stay out of the container.
      - "${SIM_STATE_DIR}/clock:/sim-clock:ro"
    networks: [sim-net]

  agent-sim-a03:
    <<: *sim-agent
    container_name: thermoctl-sim-sim-a03
    command:
      - python
      - -m
      - tools.sim.sim_agent
      - --apartment
      - sim-a03
      - --fleet
      - http://fleet:8000
      - --token-file
      - /run/secrets/agent.token
      - --state-dir
      - /sim-state
      - --interval-s
      - "5"
    volumes:
      - "${SIM_STATE_DIR}/agent-tokens/sim-a03.token:/run/secrets/agent.token:ro"
      - "${SIM_STATE_DIR}/faults:/sim-state/faults:ro"
      - "${SIM_STATE_DIR}/clock:/sim-clock:ro"
      - "..:/app/tools/sim:ro"

  agent-sim-a04:
    <<: *sim-agent
    container_name: thermoctl-sim-sim-a04
    command:
      - python
      - -m
      - tools.sim.sim_agent
      - --apartment
      - sim-a04
      - --fleet
      - http://fleet:8000
      - --token-file
      - /run/secrets/agent.token
      - --state-dir
      - /sim-state
      - --interval-s
      - "5"
    volumes:
      - "${SIM_STATE_DIR}/agent-tokens/sim-a04.token:/run/secrets/agent.token:ro"
      - "${SIM_STATE_DIR}/faults:/sim-state/faults:ro"
      - "${SIM_STATE_DIR}/clock:/sim-clock:ro"
      - "..:/app/tools/sim:ro"

  agent-sim-a05:
