# The watchdog's service user (watchdog/thermoctl-watchdog.service,
# User=thermoctl-watchdog). Without it systemd fails the unit with
# 217/USER (sim finding F40). sysusers.d is declarative and idempotent:
# an existing user is left alone. System user, no login, no home; the
# unit's Group=docker supplies the runtime access, so no "m" line here
# (it would create a "docker" group too early, before docker-ce does).
u thermoctl-watchdog - "thermoctl watchdog" - /usr/sbin/nologin
