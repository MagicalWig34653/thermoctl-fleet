name: Docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  # Two images from one repository (README.md, "One repository, two
  # images") -- a matrix instead of two nearly identical jobs.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: thermoctl-fleet
            dockerfile: docker/Dockerfile.fleet
          - name: thermoctl-agent
            dockerfile: docker/Dockerfile.agent
    steps:
      - uses: actions/checkout@v4
      # For linux/arm64 on the amd64 runner: buildx alone only builds for the
      # runner's architecture, QEMU emulates the foreign architecture while building.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # No login and no push on pull requests -- the build check still runs,
      # just without publishing to ghcr.io.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/magicalwig34653/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest only ever comes from a v* tag, never from a push to
            # main or from a pull request -- as reasoned in thermoctl/docker.yml:
            # the image is the fallback point when an update goes wrong.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # amd64 and arm64 -- the same target architectures as thermoctl
          # (Raspberry Pi 4/5 for the agent, x86_64 server for the cloud).
          # armv7 explicitly excluded.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
