# systemd-tmpfiles snippet, installed at /etc/tmpfiles.d/thermoctl-agent.conf
# during image preparation (section 19.3). Recreates /run/thermoctl-agent
# fresh on every boot -- /run is tmpfs, wiped on reboot by design (the
# same reason the health report already lived under /run/: an old report
# must never survive to cover for a freshly started, not-yet-healthy
# agent, section 22.3). systemd-tmpfiles-setup.service runs during early
# boot, before docker.service starts containers, so the directory exists
# before `docker compose up` ever tries to bind-mount it.
#
# Why a whole directory, not two file entries the way
# /var/lib/thermoctl-watchdog/state.env is a single file baked in at
# build time: the agent writes both files it keeps here (the health
# report, the new status-LED file, P5.7) atomically -- temp file plus
# `Path.replace` (agent/loop.py). A rename only ever succeeds within the
# directory it started in; if this path were bind-mounted as two
# individual *files* instead of the directory that holds them, the
# rename's temp file would land on the container's own private
# filesystem, and the rename either fails outright (EBUSY, a single-file
# bind mount cannot be replaced by renaming a different inode onto it) or
# succeeds locally and detaches the mount, silently leaving the host
# looking at a stale copy forever. Mounting the directory instead means
# the temp file and the rename target are both inside the one mounted
# tree, so the rename is a normal same-filesystem rename and actually
# reaches the host. See docs/STATUS.md's P5.7 hot-fix entry for the full
# account (this same bug already existed in P5.6's compose file for the
# state file's own directory, `/var/lib/thermoctl-watchdog`, fixed in the
# same change).
#
# Owner/group 10002, matching docker/Dockerfile.agent's `agent` user
# exactly (`groupadd --system --gid 10002 agent`, `useradd ... --uid
# 10002 --gid 10002 agent`) -- **not root**: the agent container runs as
# that unprivileged uid/gid (`USER agent`), never as root, so a
# root-owned directory here would give it no write permission at all
# (every atomic write would fail with EACCES). Both the uid and the gid
# are pinned as plain numbers on both sides deliberately (P5.7 hot-fix,
# cross-review) -- there is no "agent" user/group on the *host* for
# either file to resolve a name against, so the numeric id is the actual
# contract, not a name that happens to exist in the container's
# /etc/passwd. Mode 0755: thermoctl-watchdog and thermoctl-leds
# (unprivileged systemd services on the host, watchdog
# /thermoctl-watchdog.service, watchdog/cmd/thermoctl-leds
# /thermoctl-leds.service) only ever read from this directory, so
# world-readable is enough -- no group needs write access beyond the
# owning uid/gid itself.
#
# /var/lib/thermoctl-watchdog needs the identical 10002:10002 ownership
# for the same reason (the agent writes state.env into it) -- that
# directory is created once at image build time (section 17, "Fallback
# without a proven revision"), not recreated on every boot, so it has no
# tmpfiles.d entry of its own; the requirement is instead an explicit TODO
# in image/common/README.md and image/pi/README.md /image/x86/README.md,
# to be carried out by whichever build step (still unimplemented, section
# 19.4) actually creates that directory.
#
# **/var/lib/thermoctl-agent/pending-restore (P5.5d):** agent/__main__.py's
# own --restore-staging-dir default -- agent/restore.py's own
# `_create_and_verify_safe_dir` already creates this directory lazily,
# mode 0700, the first time a restore is ever staged, so this entry is
# not strictly required for correctness (watchdog/cmd/thermoctl-restore-mover's
# own .path unit can only ever fire once agent/restore.py has already
# written manifest.json *inside* this directory, which means the
# directory necessarily already exists by then). It is listed here
# anyway, belt and braces, for one concrete reason: this program's own
# systemd unit (thermoctl-restore-mover.service) now names exactly this
# directory in ReadWritePaths= (narrowed from its former, broader grant
# on /var/lib/thermoctl-agent itself, see that unit's own comment) --
# guaranteeing the directory (and its correct 10002:10002 owner/mode)
# exists at boot, before either program ever runs, removes any doubt
# about ordering rather than relying purely on the "manifest.json implies
# the parent already exists" argument holding in every future code path.
# Owned by the agent's own uid/gid (10002), matching what
# `_create_and_verify_safe_dir`'s own `mkdir(..., mode=0o700)` already
# produces -- **not** world-readable/writable (0700, unlike
# /run/thermoctl-agent's 0755): this directory holds a landlord's
# decrypted operational-data backup while it waits for the mover, section
# 15.1's own tenant-data handling applies to it same as everywhere else,
# even before it is uploaded/encrypted again. `d` (not `D`/`r`, the same
# reasoning as image/common/tmpfiles.d/thermoctl-restore-mover.conf's own
# choice) never empties or recreates an already-existing directory here,
# so a real staged restore survives this entry re-running on a later
# boot.
#
# Type Path                                       Mode UID   GID   Age Argument
d      /run/thermoctl-agent                       0755 10002 10002 -
d      /var/lib/thermoctl-agent/pending-restore   0700 10002 10002 -
