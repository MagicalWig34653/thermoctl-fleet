name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Kein Datenbankdienst: Das Gerüst legt nichts ab (siehe docs/STATUS.md). Sobald
  # eine Ablage entsteht, hier ergänzen -- nach demselben Muster wie thermoctls
  # ci.yml (Matrix sqlite/mariadb, THERMOCTL_TEST_DATABASE_URL-Äquivalent).
  pruefen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,fleet,agent]"
      - run: ruff check .
      - run: mypy protokoll fleet agent
      - run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.fleet .
      - run: docker build -f docker/Dockerfile.agent .
