name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Kein Datenbankdienst: Das Gerüst legt nichts ab (siehe docs/STATUS.md). Sobald
  # eine Ablage entsteht, hier ergänzen -- nach demselben Muster wie thermoctls
  # ci.yml (Matrix sqlite/mariadb, THERMOCTL_TEST_DATABASE_URL-Äquivalent).
  pruefen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,fleet,agent]"
      - run: ruff check .
      # waechter/ ist seit Abschnitt 18.3 ein Go-Modul, nicht Teil dieser
      # Python-Prüfung -- eigene CI-Spur in go.yml (Abschnitt 18.3,
      # "Die bestehende Python-Spur bleibt, wie sie ist").
      - run: mypy protokoll fleet agent tools
      # Enthält tests/test_waechter_vertrag.py (die Python-Seite des Vertrags,
      # Abschnitt 18.3) und tests/test_abbild_konfiguration.py (Abschnitt 19).
      - run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.fleet .
      - run: docker build -f docker/Dockerfile.agent .
