name: Image
on:
  push:
    paths:
      - "image/**"
      - "watchdog/thermoctl-watchdog.service"
      - "protocol/registration.py"
      - "tools/check_image_config.py"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "image/**"
      - "watchdog/thermoctl-watchdog.service"
      - "protocol/registration.py"
      - "tools/check_image_config.py"
      - ".github/workflows/image.yml"
  # Manual run for a specific commit, e.g. to confirm a merge commit on main.
  workflow_dispatch:

# For now ONLY a buildability check: read the configuration, validate the
# package list (image/README.md, "State of this scaffold"). No real pi-gen
# or mkosi/debos run -- that takes 30-60 minutes and, per the task, does not
# belong in every commit but in the release (see comment below).
jobs:
  check-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # Only the base dependency (pydantic) needed -- the check needs
      # neither the fleet nor the agent extras.
      - run: pip install -e .
      - run: python -m tools.check_image_config

