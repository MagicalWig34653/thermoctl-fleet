name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # No database service: the storage layer (P1.3, docs/STATUS.md) runs its
  # tests against a real SQLite file in `tmp_path`, created via the Alembic
  # migrations themselves -- SQLite needs no separate service container, only
  # a writable filesystem, which the runner already provides. A mariadb/
  # postgres matrix, following thermoctl's ci.yml pattern
  # (THERMOCTL_TEST_DATABASE_URL and friends), is not part of this package.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,fleet,agent]"
      - run: ruff check .
      # watchdog/ has been a Go module since section 18.3, not part of this
      # Python check -- its own CI track in go.yml (section 18.3, "the
      # existing Python track stays as it is").
      - run: mypy protocol fleet agent tools
      # Includes tests/test_watchdog_contract.py (the Python side of the
      # contract, section 18.3) and tests/test_image_config.py (section 19).
      - run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.fleet .
      - run: docker build -f docker/Dockerfile.agent .
