<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Subtle warm radial glow rising from the bottom centre, behind the
       radiator: the "heat rising" background accent. -->
  <defs>
    <radialGradient id="heatGlow" cx="50%" cy="100%" r="75%">
      <stop offset="0" stop-color="#ff9a4d" stop-opacity="0.55" />
      <stop offset="0.55" stop-color="#ff8a3d" stop-opacity="0.18" />
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#heatGlow)" />
</svg>
