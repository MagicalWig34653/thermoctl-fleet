           L 772 410
           L 772 792
           Q 772 820 744 820
           L 280 820
           Q 252 820 252 792
           L 252 410
           Z"
        fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" />

  <g fill="#ffffff">
    <rect x="462" y="420" width="100" height="260" rx="50" />
    <circle cx="512" cy="700" r="100" />
  </g>
  <path d="M512 330 C470 290 464 250 498 215 C490 252 516 266 516 296
           C540 272 540 244 522 215 C566 250 566 296 532 330 Z" fill="#ffffff" />

  <path d="M 340 884 Q 512 824 684 884" fill="none" stroke="#ffffff" stroke-width="12"
        stroke-linecap="round" opacity="0.55" />
  <g fill="#ffffff" opacity="0.9">
    <circle cx="340" cy="884" r="22" />
    <circle cx="512" cy="852" r="26" />
    <circle cx="684" cy="884" r="22" />
