{% extends "base.html" %}

{% block title %}Anmeldung – thermoctl-fleet{% endblock %}

{% block content %}
<h1>Anmeldung</h1>
{% if error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}
<form method="post" action="/ui/login">
    <input type="hidden" name="pre_csrf" value="{{ pre_csrf }}">
    <label for="username">Benutzername
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </label>
    <label for="password">Passwort
        <input type="password" id="password" name="password" autocomplete="current-password" required>
    </label>
    <label for="totp_code">Bestätigungscode (Authenticator-App)
        <input type="text" id="totp_code" name="totp_code" inputmode="numeric" autocomplete="one-time-code" required>
    </label>
    <button type="submit">Anmelden</button>
</form>
{% endblock %}
