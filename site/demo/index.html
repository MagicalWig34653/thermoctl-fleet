const paths={brand:'M4 20V9h6v11M14 20V4h6v16M7 12v1m0 3v1m10-9v1m0 3v1m0 3v1',grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',building:'M4 21V7l8-4 8 4v14M8 9h1m6 0h1M8 13h1m6 0h1M9 21v-4h6v4M2 21h20',home:'m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7',check:'m5 12 4 4L19 6',tasks:'M9 5h11M9 12h11M9 19h11M3 5h1m-1 7h1m-1 7h1',box:'m3 7 9-4 9 4v11l-9 4-9-4ZM3 7l9 4 9-4M12 11v11m-5-17 10 4',update:'M20 8a8 8 0 0 0-14-3L3 8m0-5v5h5M4 16a8 8 0 0 0 14 3l3-3m0 5v-5h-5',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2',bell:'M6 9a6 6 0 0 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9m7 12h-2',arrow:'M5 12h14m-5-5 5 5-5 5',chevron:'m9 5 7 7-7 7',plus:'M12 5v14M5 12h14',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14m5 12 6 6',wifi:'M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0m-9 4a5 5 0 0 1 6 0m-3 4h.01',offline:'M3 3l18 18M3 8a15 15 0 0 1 4-2m4-1a15 15 0 0 1 10 3M6 12a10 10 0 0 1 5-2m5 1 2 1m-9 4a5 5 0 0 1 6 0m-3 4h.01',alert:'m12 3 10 18H2ZM12 9v5m0 3h.01',battery:'M3 6h16v12H3zM22 10v4M6 9v6',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18m0 4v5l3 2',shield:'m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Zm-4 9 3 3 5-6',download:'M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4',menu:'M3 6h18M3 12h18M3 18h18',list:'M8 5h13M8 12h13M8 19h13M3 5h.01M3 12h.01M3 19h.01',back:'M19 12H5m5-5-5 5 5 5',server:'M3 3h18v7H3zM3 14h18v7H3zM6 6h.01M6 17h.01',key:'M8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10m4 9 9 9m-3-3 3-3m-6 0 3-3'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.grid}"/></svg>`;
function icons(){document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon))}
const buildings=[{name:'Lindenstraße 12',area:'Berlin · Prenzlauer Berg',count:6},{name:'Gartenweg 8',area:'Berlin · Pankow',count:6},{name:'Parkallee 3',area:'Berlin · Weißensee',count:4}];
const units=buildings.flatMap((b,bi)=>Array.from({length:b.count},(_,i)=>({id:`${bi}-${i}`,building:bi,name:`Wohnung ${String(i+1).padStart(2,'0')}`,floor:['EG links','EG rechts','1. OG links','1. OG rechts','2. OG links','2. OG rechts'][i],status:bi===0&&i===2?'offline':bi===0&&i===5?'fault':bi===1&&i===1?'battery':'ok'})));
const labels={ok:'In Ordnung',offline:'Nicht erreichbar',fault:'Sensorfehler',battery:'Batterie schwach'};
const nav=[['overview','grid','Übersicht'],['apartments','home','Wohnungen'],['tasks','tasks','Aufgaben'],['inventory','box','Einrichtung'],['updates','update','Updates']];
let acknowledged=false,viewMode='map',detailTab='overview',inventoryTab='objects',search='',property='all',state='all',rolloutPaused=false,rolloutDone=false,toastTimer,modalCallback;
const main=document.getElementById('main');
const badge=s=>`<span class="badge ${s==='offline'||s==='fault'?'error':s==='battery'?'warn':''}">${s==='ok'?'✓':s==='battery'?'◔':'!'} ${labels[s]}</span>`;
const button=(text,action,ico='plus',primary=false)=>`<button class="button ${primary?'primary':''}" data-action="${action}">${icon(ico)}${text}</button>`;
const heading=(title,sub,action='',eyebrow='MEIN PORTFOLIO')=>`<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${action}</div>`;
function pending(){return acknowledged?2:3}
function issueCards(){return [{id:'0-2',icon:'offline',title:'Basisstation nicht erreichbar',sub:'Lindenstraße 12 · Wohnung 03',since:'seit 24 Min.',label:'Verbindung prüfen'},{id:'0-5',icon:'alert',title:'Ein Sensor meldet eine Störung',sub:'Lindenstraße 12 · Wohnung 06',since:'seit 2 Std.',label:'Störung ansehen',hide:acknowledged},{id:'1-1',icon:'battery',title:'Batteriewechsel einplanen',sub:'Gartenweg 8 · Wohnung 02',since:'12 % Batterie',label:'Gerät ansehen',warn:true}].filter(x=>!x.hide).map(x=>`<button class="issue" data-detail="${x.id}"><div class="issue-top"><span class="issue-symbol ${x.warn?'warn':''}">${icon(x.icon)}</span><time>${x.since}</time></div><h3>${x.title}</h3><p>${x.sub}</p><div class="issue-bottom"><span>${x.label}</span>${icon('arrow')}</div></button>`).join('')}
function buildingCards(){return buildings.map((b,bi)=>`<article class="building"><div class="building-heading"><div><h3>${b.name}</h3><p>${b.area}</p></div>${icon('building')}</div><div class="building-picture"><span class="tree"></span><span class="tree right"></span><div class="house ${['','two','three'][bi]}">${Array.from({length:b.count/2},(_,f)=>`<div class="house-floor">${units.filter(u=>u.building===bi).slice(b.count-f*2-2,b.count-f*2).map(u=>`<button class="window ${u.status==='ok'?'':u.status==='battery'?'warn':'error'}" data-detail="${u.id}" aria-label="${b.name}, ${u.name}, ${u.floor}: ${labels[u.status]}" title="${u.name} · ${u.floor} · ${labels[u.status]}"><span class="window-dot"></span></button>`).join('')}</div>`).join('')}</div></div><div class="building-footer"><div class="building-status"><span class="muted">${b.count} Wohnungen</span><span class="badge ${bi===0?'error':bi===1?'warn':''}">${bi===0?'! 2 Auffälligkeiten':bi===1?'◔ 1 Batterie schwach':'✓ Alles in Ordnung'}</span></div><div class="status-bar" aria-hidden="true">${units.filter(u=>u.building===bi).map(u=>`<span class="${u.status==='ok'?'':u.status==='battery'?'warn':'error'}"></span>`).join('')}</div></div></article>`).join('')}
function unitTable(list=units){return `<div class="table-wrap"><table><thead><tr><th>Wohnung</th><th>Liegenschaft</th><th>Status</th><th>Letzte Meldung</th><th></th></tr></thead><tbody>${list.length?list.map(u=>`<tr data-detail="${u.id}"><td><a class="unit-title" href="#unit/${u.id}"><span class="unit-icon">${icon('home')}</span><span>${u.name}<small>${u.floor}</small></span></a></td><td>${buildings[u.building].name}</td><td>${badge(u.status)}</td><td class="muted">${u.status==='offline'?'vor 24 Minuten':'vor 32 Sekunden'}</td><td>${icon('chevron')}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Keine Wohnungen für diese Auswahl gefunden.</td></tr>'}</tbody></table></div>`}
function overview(){return heading('Alles im Blick.','Drei Liegenschaften. Ein zentraler Überblick.',button('Wohnung einrichten','setup','plus',true))+`<section class="metrics" aria-label="Portfolio in Zahlen"><div class="metric"><div class="metric-label">Wohnungen ${icon('home')}</div><div class="metric-number">16</div><div class="metric-foot">in 3 Liegenschaften</div></div><div class="metric"><div class="metric-label">Erreichbar ${icon('wifi')}</div><div class="metric-number">15 <small>/ 16</small></div><div class="metric-foot ok">93,8 % verbunden</div></div><div class="metric"><div class="metric-label">Handlungsbedarf ${icon('alert')}</div><div class="metric-number">${pending()}</div><div class="metric-foot warn">${acknowledged?'1 Störung quittiert':'2 Störungen · 1 Batterie'}</div></div><div class="metric"><div class="metric-label">Letzte Sicherungen ${icon('shield')}</div><div class="metric-number">16 <small>/ 16</small></div><div class="metric-foot ok">Alle unter 24 Stunden</div></div></section><section class="attention"><div class="section-head"><div class="section-title"><h2>Hier braucht es Sie</h2><span class="counter">${pending()}</span></div><a class="text-button" href="#tasks">Alle Aufgaben ${icon('arrow')}</a></div><div class="issues">${issueCards()}</div></section><section><div class="section-head"><div class="section-title"><h2>Ihre Liegenschaften</h2><span class="counter">3</span></div><div class="segmented" aria-label="Darstellung"><button class="${viewMode==='map'?'active':''}" data-action="map" aria-pressed="${viewMode==='map'}">${icon('grid')}Gebäude</button><button class="${viewMode==='list'?'active':''}" data-action="list" aria-pressed="${viewMode==='list'}">${icon('list')}Liste</button></div></div>${viewMode==='map'?`<div class="buildings">${buildingCards()}</div><p class="tiny muted" style="margin-top:10px">Jedes Fenster ist eine Wohnung. Anklicken öffnet die Details.</p>`:unitTable()}</section><div class="bottom-grid"><section class="panel"><div class="section-head"><h3>Zuletzt passiert</h3><span class="tiny muted">Heute</span></div><div class="activity-row"><span class="activity-icon">${icon('check')}</span><span>Sicherung erfolgreich<small>Parkallee 3 · Wohnung 04</small></span><time>14:28 Uhr</time></div><div class="activity-row"><span class="activity-icon">${icon('update')}</span><span>Software aktualisiert<small>Gartenweg 8 · Wohnung 05</small></span><time>14:16 Uhr</time></div><div class="activity-row"><span class="activity-icon">${icon('wifi')}</span><span>Basisstation wieder erreichbar<small>Parkallee 3 · Wohnung 02</small></span><time>13:52 Uhr</time></div></section><section class="panel update-panel"><div class="eyebrow">SOFTWAREVERTEILUNG</div><h3>${rolloutDone?'Rollout abgeschlossen':rolloutPaused?'Rollout pausiert':'Ein Update läuft.'}</h3><p>thermoctl 0.9.6 wird schrittweise auf die ausgewählten Wohnungen verteilt.</p><div class="update-progress"><span style="width:${rolloutDone?100:66.67}%"></span></div><div class="progress-meta"><span>${rolloutDone?6:4} von 6 Wohnungen</span><span>${rolloutDone?100:67} %</span></div><a class="text-button" style="margin-top:16px" href="#updates">Rollout ansehen ${icon('arrow')}</a></section></div>`}
function apartments(){return heading('Wohnungen','Alle Basisstationen, ihr Zustand und der letzte Kontakt.',button('Wohnung einrichten','setup','plus',true))+`<div class="toolbar"><label class="search">${icon('search')}<input id="unit-search" aria-label="Wohnungen durchsuchen" placeholder="Wohnung oder Adresse suchen …" value="${escapeHtml(search)}"></label><select id="property-filter" aria-label="Liegenschaft filtern"><option value="all">Alle Liegenschaften</option>${buildings.map((b,i)=>`<option value="${i}" ${property===String(i)?'selected':''}>${b.name}</option>`).join('')}</select><select id="state-filter" aria-label="Zustand filtern"><option value="all">Alle Zustände</option>${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${state===v?'selected':''}>${l}</option>`).join('')}</select></div><div id="unit-results">${unitTable(filteredUnits())}</div><p class="tiny muted" style="margin-top:14px" id="results-count">${filteredUnits().length} von 16 Wohnungen</p>`}
function filteredUnits(){return units.filter(u=>(property==='all'||String(u.building)===property)&&(state==='all'||u.status===state)&&`${u.name} ${u.floor} ${buildings[u.building].name}`.toLowerCase().includes(search.toLowerCase()))}
function refreshResults(){document.getElementById('unit-results').innerHTML=unitTable(filteredUnits());document.getElementById('results-count').textContent=`${filteredUnits().length} von 16 Wohnungen`}
function tasks(){return heading('Das steht an.',`${pending()} offene Aufgaben in Ihrem Portfolio.`,'','BETRIEB')+`<div class="split"><section class="task-list">${issueCards()}</section><aside class="panel" style="align-self:start"><div class="eyebrow" style="margin-bottom:10px">GUT ZU WISSEN</div><h2>Priorität hat Erreichbarkeit.</h2><p class="subtitle">Prüfen Sie zuerst die Basisstation ohne Kontakt. Eine ausbleibende Meldung sagt noch nichts über den lokalen Heizbetrieb aus.</p><div class="list-row"><span>Verbindung & Störungen</span><span class="badge error">${acknowledged?1:2} offen</span></div><div class="list-row"><span>Batterien</span><span class="badge warn">1 einplanen</span></div><div class="list-row"><span>Softwareverteilung</span><a class="text-button" href="#updates">${rolloutDone?'Abgeschlossen':rolloutPaused?'Pausiert':'Läuft'} ${icon('arrow')}</a></div></aside></div>`}
function detail(id){const u=units.find(x=>x.id===id);if(!u)return '<p>Wohnung nicht gefunden.</p>';let body='';if(detailTab==='overview')body=`${u.status!=='ok'?`<div class="notice">${icon(u.status==='battery'?'battery':'alert')}<div><b>${labels[u.status]}</b><p>${u.status==='offline'?'Seit 14:08 Uhr fehlt die Rückmeldung. Prüfen Sie Stromversorgung und Internetverbindung vor Ort.':u.status==='fault'?'Der Sensor TH-06-02 meldet seit 12:32 Uhr einen Gerätefehler.': 'Gerät TH-02-01 hat noch 12 % Batterieladung. Einen Wechsel beim nächsten Besuch einplanen.'}</p></div></div>`:''}<div class="split"><section class="panel"><div class="section-head"><h2>Erreichbarkeit</h2><span class="badge">7 Tage</span></div><div class="health-bars" aria-label="Erreichbarkeit der letzten sieben Tage: ${u.status==='offline'?'eine Unterbrechung am Ende':'durchgehend erreichbar'}">${Array.from({length:42},(_,i)=>`<i class="${u.status==='offline'&&i>38?'missing':''}"></i>`).join('')}</div><div class="progress-meta"><span>29. September</span><span>Heute</span></div><div class="list-row"><span>Letzter Kontakt</span><b>${u.status==='offline'?'vor 24 Minuten':'vor 32 Sekunden'}</b></div><div class="list-row"><span>Basisstation</span><span>${u.status==='offline'?'Nicht erreichbar':'Verbunden'}</span></div></section><section class="panel"><h2>Störungen</h2>${u.status==='fault'?`<div class="list-row"><div><b>Sensor antwortet nicht</b><small>TH-06-02 · seit heute, 12:32</small></div>${badge('fault')}</div><p class="subtitle">${acknowledged?'Quittiert durch Hausverwaltung. Die Störung bleibt bis zur Behebung sichtbar.':'Die Meldung wurde noch nicht bestätigt.'}</p>${button(acknowledged?'Bereits quittiert':'Störung quittieren',acknowledged?'ack-info':'ack','check',true)}`:`<div class="empty">${icon('check')}<p>Keine Gerätefehler gemeldet.</p>${u.status==='offline'?'<p class="tiny">Datenstand vor Verbindungsabbruch.</p>':''}</div>`}</section><section class="panel" style="grid-column:1/-1"><div class="section-head"><h2>Batterie & Signal</h2><span class="tiny muted">3 Geräte · letzter gemeldeter Stand</span></div>${['01','02','03'].map((n,i)=>`<div class="list-row"><div>Thermostat TH-${u.name.slice(-2)}-${n}<small>${i===1&&u.status==='fault'?'Sensorfehler':'Verbunden mit der Basisstation'}</small></div><div style="display:flex;gap:20px;align-items:center"><span class="${i===0&&u.status==='battery'?'badge warn':'muted'}">${i===0&&u.status==='battery'?12:89-i*11} % Batterie</span><span class="tiny muted">${i===1&&u.status==='fault'?'Kein Signal':'−'+(56+i*4)+' dBm'}</span></div></div>`).join('')}</section></div>`;
if(detailTab==='maintenance')body=`<div class="split"><section class="panel"><h2>Diagnose & Wartung</h2><p class="subtitle">Wartungsauftrag an die Basisstation senden.</p><div class="action-grid">${button('Status jetzt abrufen','command:Status abrufen','wifi')}${button('Protokolle abrufen','command:Protokolle abrufen','list')}${button('Diagnosepaket erstellen','command:Diagnosepaket erstellen','box')}${button('Agent neu starten','command:Agent neu starten','update')}</div><div class="list-row" style="margin-top:20px"><span>Letzter Auftrag<small>Status abrufen · heute, 13:45</small></span><span class="badge">Erfolgreich</span></div></section><section class="panel"><div class="section-head"><h2>Sicherungen</h2>${button('Sichern','command:Sicherung erstellen','plus')}</div><div class="list-row"><span>Heute, 04:00 Uhr<small>Verschlüsselt · 2,4 MB</small></span><button class="icon-button" aria-label="Demo-Sicherungsinformation herunterladen" data-action="download">${icon('download')}</button></div><div class="list-row"><span>Gestern, 04:00 Uhr<small>Verschlüsselt · 2,3 MB</small></span><button class="icon-button" aria-label="Demo-Sicherungsinformation herunterladen" data-action="download">${icon('download')}</button></div>${button('Wiederherstellen','restore','update')}</section><section class="panel" style="grid-column:1/-1"><h2>Wohnung übergeben</h2><p class="subtitle">Mieterwechsel und Gerätetausch werden als eigene, geführte Vorgänge behandelt.</p><div class="action-grid">${button('Mieterwechsel vorbereiten','tenant','key')}${button('Basisstation austauschen','replace','server')}</div></section></div>`;
if(detailTab==='tech')body=`<div class="split"><section class="panel"><h2>Basisstation</h2>${[['Gerät','FL-'+u.id.replace('-','0')+'24'],['Hardware','Raspberry Pi 4 · 2 GB'],['Betriebssystem','Debian 12'],['Betriebszeit','18 Tage, 4 Stunden'],['Arbeitsspeicher','412 MB / 2 GB'],['Speicherplatz','6,2 GB / 32 GB']].map(([k,v])=>`<div class="list-row"><span class="muted">${k}</span><span>${v}</span></div>`).join('')}</section><section class="panel"><div class="section-head"><h2>Software & Sollzustand</h2></div>${[['thermoctl','0.9.6'],['Agent','0.4.2'],['Zigbee2MQTT','2.6.1'],['Mosquitto','2.0.22']].map(([k,v])=>`<div class="list-row"><span>${k}<small>Container läuft</small></span><span>${v}</span></div>`).join('')}<div style="margin-top:20px">${button('Sollzustand bearbeiten','desired','settings')}</div></section></div>`;
return `<a class="text-button back" href="#apartments">${icon('back')}Alle Wohnungen</a><div class="detail-top"><div><div class="eyebrow" style="margin-bottom:8px">${buildings[u.building].name} / ${u.floor}</div><h1>${u.name}</h1><p class="subtitle">Basisstation FL-${u.id.replace('-','0')}24</p></div>${badge(u.status)}</div><div class="tabs" aria-label="Wohnungsbereiche">${[['overview','Überblick'],['maintenance','Wartung'],['tech','Technik']].map(([v,l])=>`<button data-tab="${v}" class="${detailTab===v?'active':''}" aria-pressed="${detailTab===v}">${l}</button>`).join('')}</div>${body}`}
function inventory(){let content='';if(inventoryTab==='objects')content=`<div class="split"><section class="panel"><h2>Liegenschaften & Wohnungen</h2>${buildings.map((b,i)=>`<div class="list-row"><div><b>${b.name}</b><small>${b.area} · ${b.count} Wohnungen</small></div><button class="text-button" data-property="${i}">Ansehen ${icon('arrow')}</button></div>`).join('')}<div style="margin-top:20px">${button('Liegenschaft anlegen','new-property','plus')}</div></section><section class="panel" style="align-self:start"><div class="eyebrow" style="margin-bottom:12px">NEUE INSTALLATION</div><h2>Eine Wohnung anschließen.</h2><p class="subtitle">Wohnung zuordnen, Basisstation vorbereiten und die erste Verbindung bestätigen.</p><div style="margin-top:23px">${button('Einrichtung starten','setup','arrow',true)}</div></section></div>`;
if(inventoryTab==='devices')content=`<section class="panel"><div class="section-head"><h2>Basisstationen im Lager</h2>${button('Gerät registrieren','register','plus',true)}</div>${[['FL-0028','Raspberry Pi 4','Im Lager'],['FL-0029','Raspberry Pi 4','Im Lager'],['FL-0011','Raspberry Pi 3','Defekt']].map(([id,hw,s])=>`<div class="list-row"><span>${id}<small>${hw}</small></span><div style="display:flex;gap:15px;align-items:center"><span class="badge ${s==='Defekt'?'error':'gray'}">${s}</span><button class="text-button" data-action="${s==='Defekt'?'device-state':'setup'}">${s==='Defekt'?'Zustand ändern':'Vorbereiten'} ${icon('arrow')}</button></div></div>`).join('')}<div style="margin-top:20px">${button('Registrierungen prüfen','registrations','check')}</div></section>`;
if(inventoryTab==='prepare')content=`<section class="panel" style="max-width:760px"><h2>Schritt für Schritt zur neuen Basisstation</h2><div class="steps"><div class="step"><div><h3>Wohnung auswählen</h3><p>Liegenschaft und Wohnung zuordnen oder eine neue Wohnung anlegen.</p>${button('Wohnung zuordnen','setup','home')}</div></div><div class="step"><div><h3>Basisstation vorbereiten</h3><p>Ein Gerät aus dem Lager auswählen und die Registrierung vorbereiten.</p>${button('Gerät auswählen','register','server')}</div></div><div class="step"><div><h3>Vor Ort verbinden</h3><p>Basisstation mit Strom und Internet verbinden. Die Anmeldung erscheint anschließend zur Bestätigung.</p></div></div><div class="step"><div><h3>Registrierung bestätigen</h3><p>Gerätedaten prüfen und die Zuordnung freigeben.</p>${button('Registrierungen prüfen','registrations','check')}</div></div></div></section>`;return heading('Gut eingerichtet.','Liegenschaften organisieren und Basisstationen in Betrieb nehmen.','','VERWALTUNG')+`<div class="tabs">${[['objects','Objekte & Wohnungen'],['devices','Basisstationen'],['prepare','Neue Installation']].map(([v,l])=>`<button data-inventory-tab="${v}" class="${inventoryTab===v?'active':''}" aria-pressed="${inventoryTab===v}">${l}</button>`).join('')}</div>${content}`}
function updates(){return heading('Updates mit Überblick.','Software kontrolliert und schrittweise verteilen.',button('Neuer Rollout','new-rollout','plus',true),'SOFTWARE')+`<section class="panel"><div class="section-head"><span class="badge ${rolloutPaused?'warn':''}">${rolloutDone?'✓ Abgeschlossen':rolloutPaused?'Ⅱ Pausiert':'● Rollout läuft'}</span><span class="tiny muted">Gestartet heute, 14:00 Uhr</span></div><div class="rollout-block"><div><h2>thermoctl 0.9.6</h2><p class="subtitle">Gartenweg 8 · 6 Wohnungen · nacheinander</p></div><div><div class="rollout-number">${rolloutDone?6:4}<small> / 6 aktualisiert</small></div><div class="update-progress"><span style="width:${rolloutDone?100:66.67}%"></span></div></div></div><div class="list-row"><span class="muted">${rolloutDone?'Alle ausgewählten Wohnungen sind auf dem Zielstand.':'4 erfolgreich · '+(rolloutPaused?'2 warten auf Fortsetzung':'1 wird aktualisiert · 1 wartet')}</span>${rolloutDone?'':button(rolloutPaused?'Fortsetzen':'Pausieren','pause','update')}</div></section><h2 style="margin:26px 0 15px">Wohnungen im Rollout</h2><div class="table-wrap"><table><thead><tr><th>Wohnung</th><th>Version</th><th>Fortschritt</th><th>Ergebnis</th></tr></thead><tbody>${units.filter(u=>u.building===1).map((u,i)=>`<tr data-detail="${u.id}"><td><a href="#unit/${u.id}">${u.name}</a></td><td>${i<4||rolloutDone?'0.9.6':'0.9.5 → 0.9.6'}</td><td>${i<4||rolloutDone?'Abgeschlossen':i===4&&!rolloutPaused?'Wird aktualisiert':'Wartet'}</td><td><span class="badge ${i>=4&&!rolloutDone?'gray':''}">${i<4||rolloutDone?'✓ Erfolgreich':'—'}</span></td></tr>`).join('')}</tbody></table></div><p class="privacy">${icon('shield')}Bei einem Fehler wird die Verteilung angehalten, bevor weitere Wohnungen folgen.</p>`}
function account(){return heading('Ihr Konto.','Anmeldung und Zugriff auf Ihre Fleet-Verwaltung.','','EINSTELLUNGEN')+`<section class="panel account-card"><h2>Hausverwaltung</h2><div class="list-row"><span>Rolle</span><span class="badge">Administrator</span></div><div class="list-row"><span>Passkeys<small>Mit einem Sicherheitsschlüssel oder Ihrem Gerät anmelden.</small></span>${button('Passkey hinzufügen','passkey','key')}</div><div class="list-row"><span>Zwei-Faktor-Anmeldung<small>Authenticator-App eingerichtet</small></span><span class="badge">Aktiv</span></div><div class="list-row"><span>Aktuelle Sitzung<small>Demo · lokaler Browser</small></span>${button('Abmelden','logout','arrow')}</div></section><div class="privacy">${icon('shield')}Fleet empfängt Zustandsdaten. Temperaturen, Zeitpläne und Mieterdaten bleiben in der Wohnung.</div>`}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function route(){return (location.hash.slice(1)||'overview').split('/')}
function render(){const [page,id]=route();document.getElementById('nav').innerHTML=nav.map(([v,i,l])=>`<a href="#${v}" class="nav-link ${(page===v||page==='unit'&&v==='apartments')?'active':''}" ${(page===v||page==='unit'&&v==='apartments')?'aria-current="page"':''}>${icon(i)}${l}${v==='tasks'?`<span class="count">${pending()}</span>`:''}${v==='updates'&&!rolloutDone?'<span class="count">1</span>':''}</a>`).join('');const name=page==='unit'?'Wohnungen / Details':page==='account'?'Konto':nav.find(n=>n[0]===page)?.[2]||'Übersicht';document.getElementById('crumb').textContent=name;document.title=`${name} · thermoctl fleet`;main.innerHTML=(page==='unit'?detail(id):({overview,apartments,tasks,inventory,updates,account}[page]||overview)())+`<footer class="footer"><span>thermoctl fleet <span style="padding:0 8px">·</span> Mit Ruhe verwalten.</span><span>Demodaten · 5. Oktober 2026, 14:32 Uhr</span></footer>`;icons();document.body.classList.remove('menu-open')}
function toast(message){clearTimeout(toastTimer);const e=document.getElementById('toast');e.textContent=message;e.hidden=false;toastTimer=setTimeout(()=>e.hidden=true,4500)}
function modal(title,content,submit='In Demo bestätigen',callback=()=>toast('In der Demo bestätigt. Es wurde kein Auftrag an ein Gerät gesendet.')){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-content').innerHTML=content;document.getElementById('dialog-submit').textContent=submit;modalCallback=callback;document.getElementById('dialog').showModal()}
const info=p=>`<p>${p}</p>`;
function action(a){if(a==='menu'){document.body.classList.add('menu-open');return}if(a==='menu-close'){document.body.classList.remove('menu-open');return}if(a==='dialog-close'){document.getElementById('dialog').close();return}if(a==='map'||a==='list'){viewMode=a;render();return}if(a==='ack-info'){toast('Die Störung ist bereits quittiert. Sie bleibt bis zur Behebung sichtbar.');return}if(a==='ack'){modal('Störung quittieren',info('Bestätigen Sie, dass Sie den Sensorfehler gesehen haben. Die technische Störung bleibt sichtbar, bis sie behoben ist.'),'Quittieren',()=>{acknowledged=true;render();toast('Störung quittiert. Die Aufgabe ist bestätigt.');});return}if(a==='pause'){rolloutPaused=!rolloutPaused;render();toast(rolloutPaused?'Demo-Rollout pausiert.':'Demo-Rollout wird fortgesetzt.');return}
if(a==='setup'){modal('Wohnung einrichten',info('Legen Sie die Zuordnung für eine neue Installation fest.')+`<label>Liegenschaft<select name="property">${buildings.map(b=>`<option>${b.name}</option>`).join('')}</select></label><label>Wohnungsbezeichnung<input name="unit" type="text" placeholder="z. B. Wohnung 07" required></label><label>Basisstation<select name="device"><option>FL-0028 · Raspberry Pi 4</option><option>FL-0029 · Raspberry Pi 4</option></select></label>`,'Einrichtung vormerken',()=>toast('Einrichtung in der Demo vorgemerkt. Es wurde keine Wohnung im echten System angelegt.'));return}
if(a.startsWith('command:')){const title=a.slice(8);modal(title,info('Dieser Wartungsauftrag würde an die Basisstation der ausgewählten Wohnung gesendet. In dieser Demo wird nur der Ablauf demonstriert.'),'Auftrag simulieren');return}
const dialogs={
'new-property':['Liegenschaft anlegen',info('Eine neue Liegenschaft für Ihre Wohnungen vorbereiten.')+'<label>Name<input type="text" required placeholder="z. B. Birkenhof"></label><label>Adresse<input type="text" required placeholder="Straße und Hausnummer"></label>'],
'register':['Basisstation registrieren',info('Gerät erfassen und für eine Zuordnung vorbereiten.')+'<label>Gerätekennung<input type="text" required placeholder="FL-0030"></label><label>Hardware<select><option>Raspberry Pi 4</option><option>Raspberry Pi 5</option><option>x86 Basisstation</option></select></label>'],
'device-state':['Gerätezustand ändern','<label>Neuer Zustand<select><option>Im Lager · einsatzbereit</option><option>Defekt</option></select></label>'],
'registrations':['Geräteregistrierungen',info('Aktuell warten keine Basisstationen auf Bestätigung. Sobald sich ein vorbereitetes Gerät anmeldet, erscheint es hier mit seiner Zuordnung.')],
'restore':['Sicherung wiederherstellen',info('Wählen Sie eine Sicherung und den zugehörigen privaten Schlüssel. Im echten Ablauf wird die Sicherung lokal entschlüsselt. Diese Demo verarbeitet keine Schlüssel.')+'<label>Sicherung<select><option>Heute, 04:00 Uhr · 2,4 MB</option><option>Gestern, 04:00 Uhr · 2,3 MB</option></select></label>'],
'desired':['Sollzustand bearbeiten',info('Zielversionen der vier Dienste festlegen. Beispielwerte für die Demo.')+['thermoctl','Agent','Zigbee2MQTT','Mosquitto'].map((l,i)=>`<label>${l}<input type="text" value="${['0.9.6','0.4.2','2.6.1','2.0.22'][i]}" required></label>`).join('')],
'replace':['Basisstation austauschen',info('Die Wohnung bleibt bestehen. Eine Ersatzstation übernimmt nach bestätigter Zuordnung.')+'<label>Ersatzgerät<select><option>FL-0028 · Im Lager</option><option>FL-0029 · Im Lager</option></select></label>'],
 'tenant':['Mieterwechsel vorbereiten',info('Der echte Vorgang setzt wohnungsbezogene Daten gemäß dem Übergabeprozess zurück. Prüfen Sie vorher die Sicherung und die Gerätezuordnung. Hier wird ausschließlich der Bestätigungsschritt gezeigt.')+'<label><input type="checkbox" required style="display:inline;width:auto;margin-right:7px">Demo-Übergabe bestätigen</label>'],
'passkey':['Passkey hinzufügen',info('Im echten System startet hier die Registrierung mit Touch ID, Windows Hello oder einem Sicherheitsschlüssel. Diese HTML-Demo legt keinen echten Passkey an.')],
'logout':['Demo-Sitzung beenden',info('Es besteht keine echte Anmeldung. Mit Bestätigen gelangen Sie zur Login-Demo.')]
};if(a==='new-rollout'){modal('Neuen Rollout vorbereiten',info('Dienst, Zielversion und Liegenschaft auswählen. Der aktuelle Demo-Rollout wird dadurch nicht verändert.')+'<label>Dienst<select><option>thermoctl</option><option>Agent</option><option>Zigbee2MQTT</option><option>Mosquitto</option></select></label><label>Zielversion<input type="text" required placeholder="0.9.7"></label><label>Liegenschaft<select>'+buildings.map(b=>`<option>${b.name}</option>`).join('')+'</select></label>','Rollout simulieren');return}if(a==='download'){const blob=new Blob(['thermoctl fleet — Demo\nDies ist eine Demo-Information, keine echte Sicherung.\nIm Produkt wird hier die verschlüsselte Sicherung heruntergeladen.'],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='fleet-demo-sicherung-info.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Demo-Information heruntergeladen.');return}if(dialogs[a]){modal(...dialogs[a],a==='registrations'?'Verstanden':'In Demo bestätigen',()=>{if(a==='logout'){location.href='login.html';return}toast(a==='registrations'?'Keine offenen Registrierungen.':'Demo-Schritt bestätigt. Es wurden keine echten Daten verändert.');});}}
document.addEventListener('click',e=>{if(e.target.closest('.sidebar a'))document.body.classList.remove('menu-open');const d=e.target.closest('[data-detail]');if(d){detailTab='overview';location.hash='unit/'+d.dataset.detail;return}const t=e.target.closest('[data-tab]');if(t){detailTab=t.dataset.tab;render();return}const it=e.target.closest('[data-inventory-tab]');if(it){inventoryTab=it.dataset.inventoryTab;render();return}const p=e.target.closest('[data-property]');if(p){property=p.dataset.property;search='';state='all';location.hash='apartments';return}const a=e.target.closest('[data-action]');if(a)action(a.dataset.action)});
document.addEventListener('input',e=>{if(e.target.id==='unit-search'){search=e.target.value;refreshResults()}});document.addEventListener('change',e=>{if(e.target.id==='property-filter'){property=e.target.value;refreshResults()}if(e.target.id==='state-filter'){state=e.target.value;refreshResults()}});document.getElementById('dialog-form').addEventListener('submit',e=>{e.preventDefault();document.getElementById('dialog').close();modalCallback?.()});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('menu-open')});window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script>
</body></html>
