name: Image
on:
  # Deliberately NO `paths:` filter on `push` (unlike `pull_request` below):
  # GitHub ANDs a `tags:` filter with a `paths:` filter on the same `push`
  # trigger against the files changed by that push's own commits -- a tag
  # push by itself usually changes no files at all, which would silently
  # skip the whole release path. `check-configuration` is cheap enough to
  # just run on every push; the expensive build/publish jobs below are
  # gated with their own `if: startsWith(github.ref, 'refs/tags/v')`
  # instead of a path filter.
  push: {}
  pull_request:
    paths:
      - "image/**"
      - "watchdog/**"
      - "protocol/registration.py"
      - "tools/check_image_config.py"
      - ".github/workflows/image.yml"
  # Manual run for a specific commit, e.g. to confirm a merge commit on main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unchanged from before (section 19, "State of this scaffold"): a fast
  # check that reads the configuration and validates the package list --
  # no real build. Runs on every push/PR, same as always.
  check-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - run: python -m tools.check_image_config
      - name: shellcheck image/common/install.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck image/common/install.sh image/common/apt/fetch-docker-key.sh

  # Builds the three watchdog binaries once, for both architectures, and
  # hands them to the two real image-build jobs below as artifacts -- the
  # same binaries go.yml's own "build" job produces, just also available to
  # this workflow without a cross-workflow artifact download. Runs only on a
  # `v*` tag: section 19.4's own "does not belong in every commit".
  build-watchdog-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    defaults:
      run:
        working-directory: watchdog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: watchdog/go.mod
      - run: go vet ./...
      - run: go test ./...
      - env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../image-bin
          go build -trimpath -o ../image-bin/thermoctl-watchdog .
          go build -trimpath -o ../image-bin/thermoctl-leds ./cmd/thermoctl-leds
          go build -trimpath -o ../image-bin/thermoctl-restore-mover ./cmd/thermoctl-restore-mover
      - uses: actions/upload-artifact@v4
        with:
          name: watchdog-binaries-${{ matrix.arch }}
          path: image-bin/

  # Raspberry Pi image (section 19.4, arm64): pi-gen, the official
  # Raspberry Pi tool. Builds on top of Raspberry Pi OS Lite 64-bit and
  # applies image/common/install.sh as a custom stage
  # (image/pi/pi-gen-stage/) instead of a from-scratch rootfs build --
  # exactly the "build on Raspberry Pi OS Lite as a base" reasoning
  # image/pi/README.md already documents. pi-gen itself runs inside Docker
  # with QEMU user-mode emulation (its own build-docker.sh) and needs
  # privileged containers for loop-device/mount access -- both of which a
  # standard ubuntu-latest GitHub-hosted runner provides.
  #
  # **Not run in this sandbox** (no privileged loop-device mounts available
  # here, see this task's own report) -- syntax-checked with actionlint and
  # reviewed against pi-gen's own documented `build-docker.sh` usage
  # instead. A real run takes 30-60 minutes, which is why it is gated on a
  # `v*` tag rather than every push.
  build-pi-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-watchdog-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: thermoctl-fleet
      - uses: actions/download-artifact@v4
        with:
          name: watchdog-binaries-arm64
          path: thermoctl-fleet/image/pi/pi-gen-stage/01-thermoctl/files/usr-local-bin
      - name: Clone pi-gen
        run: git clone --depth 1 --branch arm64 https://github.com/RPi-Distro/pi-gen.git pi-gen
      - name: Install pi-gen's own build dependencies (loop device tooling, qemu-user-static)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            quilt qemu-user-static debootstrap zerofree zip dosfstools \
            libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc \
            qemu-utils kpartx parted
      - name: Wire the thermoctl custom stage into pi-gen
        run: |
          set -eu
          STAGE_SRC="thermoctl-fleet/image/pi/pi-gen-stage/01-thermoctl"
          STAGE_DST="pi-gen/stage-thermoctl"
          mkdir -p "$STAGE_DST"
          cp -r "$STAGE_SRC"/* "$STAGE_DST"/
          # install.sh itself + image/common/ -- the custom stage's own
          # 00-run.sh chroots in and runs it directly from this copy, so
          # pi-gen's offline chroot does not need network access to this
          # repository at all.
          mkdir -p "$STAGE_DST/files/thermoctl-fleet"
          cp -r thermoctl-fleet/image "$STAGE_DST/files/thermoctl-fleet/image"
          cp -r thermoctl-fleet/watchdog "$STAGE_DST/files/thermoctl-fleet/watchdog"
          # EXPORT_IMAGE marks a stage as the one whose rootfs pi-gen turns
          # into a finished .img at the end of the run (pi-gen's own
          # convention -- an empty marker file is enough).
          touch "$STAGE_DST/EXPORT_IMAGE"
      - name: Build with pi-gen (build-docker.sh)
        env:
          IMG_NAME: thermoctl-base-station
          RELEASE: trixie
          PI_GEN_RELEASE: false
          # Only through our own stage and the two base stages it depends
          # on -- pi-gen's own stage2 is "Raspberry Pi OS Lite", everything
          # from stage3 on (desktop, docs, ...) is explicitly skipped.
          STAGE_LIST: "stage0 stage1 stage2 stage-thermoctl"
        run: |
          cd pi-gen
          ./build-docker.sh
      - name: Compress and checksum
        run: |
          set -eu
          cd pi-gen/deploy
          for img in *.img; do
            xz -T0 -9 "$img"
          done
          sha256sum ./*.img.xz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: thermoctl-base-station-pi
          path: |
            pi-gen/deploy/*.img.xz
            pi-gen/deploy/SHA256SUMS

  # amd64 image (section 19.4): mkosi, not debos.
  #
  # **Why mkosi over debos:** both produce a finished Debian image from a
  # declarative configuration (image/x86/README.md's own "not yet decided"
  # note) -- the actual tie-breaker is systemd. This repository's one
  # bare-metal component (the watchdog) is driven entirely by systemd units
  # (thermoctl-watchdog.service, the restore-mover's .path unit), and mkosi
  # is itself a systemd upstream project, maintained in the systemd
  # repository, with first-class support for the same boot/partition
  # conventions (GPT, discoverable partitions) systemd-boot and
  # systemd-based initrds expect. debos is older, Go-templated, and
  # Debian-packaged, but has no particular alignment with systemd beyond
  # "it can debootstrap a Debian chroot" -- mkosi gets the same result with
  # one declarative `mkosi.conf` instead of a bespoke YAML recipe format,
  # and its `mkosi.postinst`/`finalize` scripts are plain shell, letting
  # this job call image/common/install.sh completely unchanged.
  #
  # **Not run in this sandbox** (needs a Linux loop-device/systemd-nspawn
  # environment this macOS worktree does not have) -- syntax-checked with
  # actionlint and reviewed against mkosi's own documented CLI instead.
  build-x86-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-watchdog-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: thermoctl-fleet
      - uses: actions/download-artifact@v4
        with:
          name: watchdog-binaries-amd64
          path: thermoctl-fleet/image/x86/watchdog-bin
      - name: Install mkosi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mkosi debootstrap systemd-container qemu-utils dosfstools
      - name: Build with mkosi
        working-directory: thermoctl-fleet/image/x86
        run: |
          sudo mkosi --output-dir ../../mkosi-out build
      - name: Compress and checksum
        working-directory: thermoctl-fleet
        run: |
          set -eu
          mkdir -p dist
          img="$(find mkosi-out -maxdepth 1 -name '*.raw' -print -quit)"
          xz -T0 -9 -c "$img" > dist/thermoctl-base-station-x86.img.xz
          cd dist && sha256sum ./*.img.xz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: thermoctl-base-station-x86
          path: |
            thermoctl-fleet/dist/*.img.xz
            thermoctl-fleet/dist/SHA256SUMS

  # Attaches both .img.xz files plus their checksums to this tag's GitHub
  # release -- "the image version should carry the same number as the
  # watchdog version shipped inside it" (image/README.md, "What is
  # missing"): both now come from the exact same `v*` tag and the exact
  # same build-watchdog-binaries job's output, so there is no separate
  # version number to keep in sync any more -- the tag itself is that
  # number, for the watchdog binaries inside the image and for the image
  # file name alike.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-pi-image, build-x86-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: thermoctl-base-station-pi
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: thermoctl-base-station-x86
          path: release/
      - name: Merge the two SHA256SUMS files
        run: |
          cd release
          cat SHA256SUMS SHA256SUMS > /dev/null 2>&1 || true
          find . -maxdepth 1 -name 'SHA256SUMS*' -exec cat {} + | sort -u > SHA256SUMS.combined
          mv SHA256SUMS.combined SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.img.xz
            release/SHA256SUMS
          fail_on_unmatched_files: true
