[project]
name = "thermoctl-fleet"
version = "0.1.0"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# The shared contract (protocol/) only needs Pydantic and is therefore included
# in both images (fleet, agent) without either pulling in the other's extra.
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Cloud side: FastAPI application, SSE output.
fleet = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    # Storage layer (P1.3): SQLAlchemy + Alembic migrations, cloud side only --
    # the agent image must not pull these in, hence the `fleet` extra and not
    # a base dependency.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Absence alarming (P2.2, section 8): the generic webhook notifier. SMTP
    # notification uses stdlib `smtplib`, no extra dependency needed for it.
    "httpx>=0.27",
]
# Device side: HTTP client for heartbeat/events, SSE client for the
# command channel.
agent = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    # For FastAPI's TestClient -- not "httpx": for Python 3.14, httpx2 is the
    # recommended replacement, see starlette.testclient's warning about httpx.
    "httpx2>=2.12",
    "ruff>=0.16",
    "mypy>=1.18",
    # Local SMTP server for testing the SMTP notifier (P2.2) against a real
    # receiver -- no mocks, per CLAUDE.md's testing method.
    "aiosmtpd>=1.4",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# watchdog/ is deliberately NOT listed here: since section 18.3 it is a
# standalone Go module (watchdog/go.mod), not a Python package -- see
# watchdog/README.md. tools* is pure build/CI tooling (image/ configuration
# check) and does not go into any Docker image.
# fleet.migrations* (P1.3) matches "fleet*" and is picked up automatically --
# it is a proper package (has __init__.py, see fleet/migrations/__init__.py
# and fleet/migrations/versions/__init__.py), so the Alembic scripts land in
# the fleet Docker image without a separate package-data entry.
include = ["protocol*", "fleet*", "agent*", "tools*"]

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert is welcome in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=protocol --cov=fleet --cov=agent --cov=tools --cov-report=term-missing"
