name: Image
on:
  # Deliberately NO `paths:` filter on `push` (unlike `pull_request` below):
  # GitHub ANDs a `tags:` filter with a `paths:` filter on the same `push`
  # trigger against the files changed by that push's own commits -- a tag
  # push by itself usually changes no files at all, which would silently
  # skip the whole release path. `check-configuration` is cheap enough to
  # just run on every push; the expensive build/publish jobs below are
  # gated with their own `if: startsWith(github.ref, 'refs/tags/v')`
  # instead of a path filter.
  push: {}
  pull_request:
    paths:
      - "image/**"
      - "watchdog/**"
      - "protocol/registration.py"
      - "tools/check_image_config.py"
      - ".github/workflows/image.yml"
  # Manual run for a specific commit, e.g. to confirm a merge commit on
  # main actually builds. Each build job below is individually gated with
  # `if: startsWith(github.ref, 'refs/tags/v') || github.event_name ==
  # 'workflow_dispatch'`, so a manual run also exercises
  # build-watchdog-binaries/build-pi-image/build-x86-image (uploading the
  # .img.xz + SHA256SUMS as plain workflow artifacts) -- but never
  # publish-release, which stays gated on the tag alone, below.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unchanged from before (section 19, "State of this scaffold"): a fast
  # check that reads the configuration and validates the package list --
  # no real build. Runs on every push/PR, same as always.
  check-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      # tools/check_image_config.py imports agent.encryption/agent.registration
      # (DEFAULT_RECIPIENTS_FILE / DEFAULT_REGISTRATION_FILE) -- a plain
      # `pip install -e .` only pulls the base `pydantic` dependency, so the
      # `agent` extra (pyrage, cryptography, httpx, ...) has to come along;
      # `fleet` is not needed here, keeping the job minimal.
      - run: pip install -e ".[agent]"
      - run: python -m tools.check_image_config
      - name: shellcheck image/common/install.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck image/common/install.sh image/common/firstboot-wifi.sh \
            image/common/apt/fetch-docker-key.sh image/x86/mkosi.postinst.chroot

  # Builds the three watchdog binaries once, for both architectures, and
  # hands them to the two real image-build jobs below as artifacts -- the
  # same binaries go.yml's own "build" job produces, just also available to
  # this workflow without a cross-workflow artifact download. Runs on a
  # `v*` tag (section 19.4's own "does not belong in every commit") or a
  # manual `workflow_dispatch` run -- the latter for confirming a real
  # build on a specific commit (e.g. a merge to main) without cutting a
  # release: `publish-release` below stays gated on the tag alone, so a
  # manual run only ever uploads workflow artifacts, never a GitHub
  # release asset.
  build-watchdog-binaries:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    defaults:
      run:
        working-directory: watchdog
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache-dependency-path: watchdog/go.mod
      - run: go vet ./...
      - run: go test ./...
      - env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../image-bin
          go build -trimpath -o ../image-bin/thermoctl-watchdog .
          go build -trimpath -o ../image-bin/thermoctl-leds ./cmd/thermoctl-leds
          go build -trimpath -o ../image-bin/thermoctl-restore-mover ./cmd/thermoctl-restore-mover
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4.6.2
        with:
          name: watchdog-binaries-${{ matrix.arch }}
          path: image-bin/

  # Raspberry Pi image (section 19.4, arm64): pi-gen, the official
  # Raspberry Pi tool. Builds on top of Raspberry Pi OS Lite 64-bit and
  # applies image/common/install.sh as a custom stage
  # (image/pi/pi-gen-stage/) instead of a from-scratch rootfs build --
  # exactly the "build on Raspberry Pi OS Lite as a base" reasoning
  # image/pi/README.md already documents. pi-gen itself runs inside Docker
  # with QEMU user-mode emulation (its own build-docker.sh) and needs
  # privileged containers for loop-device/mount access -- both of which a
  # standard ubuntu-latest GitHub-hosted runner provides.
  #
  # **Not run in this sandbox** (no privileged loop-device mounts available
  # here, see this task's own report) -- syntax-checked with actionlint and
  # reviewed against pi-gen's own documented `build-docker.sh` usage
  # instead. A real run takes 30-60 minutes, which is why it is gated on a
  # `v*` tag or a manual `workflow_dispatch` run rather than every push --
  # see build-watchdog-binaries above for why workflow_dispatch is
  # included here too (uploads a workflow artifact only, never a release).
  build-pi-image:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-watchdog-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: thermoctl-fleet
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: watchdog-binaries-arm64
          path: thermoctl-fleet/image/pi/pi-gen-stage/01-thermoctl/files/usr-local-bin
      - name: Clone pi-gen
        # Pinned commit on pi-gen's own `arm64` branch (the branch that
        # defaults RELEASE to trixie and supports building arm64 images --
        # the `master` branch targets armhf) instead of a floating branch
        # tip, so a future upstream pi-gen change cannot silently break
        # this job.
        run: |
          git clone https://github.com/RPi-Distro/pi-gen.git pi-gen
          git -C pi-gen checkout 4d8ee447dd3d37e8b0ef8752e460d9082d9d435d
      - name: Install pi-gen's own build dependencies (loop device tooling, qemu-user-static)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            quilt qemu-user-static debootstrap zerofree zip dosfstools \
            libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc \
            qemu-utils kpartx parted
      - name: Wire the thermoctl custom stage into pi-gen
        run: |
          set -eu
          STAGE_SRC="thermoctl-fleet/image/pi/pi-gen-stage"
          STAGE_DST="pi-gen/stage-thermoctl"
          mkdir -p "$STAGE_DST"
          # prerun.sh lives at the STAGE level (pi-gen's own convention,
          # confirmed against stage0/stage1/stage2/prerun.sh upstream) --
          # without it, pi-gen never copies the previous stage's rootfs
          # into this stage's own work dir, and both 01-thermoctl/00-run.sh
          # and pi-gen's own later export-image/du sizing step fail
          # against a rootfs directory that was never created
          # ("du: cannot access '.../stage-thermoctl/rootfs'").
          cp "$STAGE_SRC/prerun.sh" "$STAGE_DST/prerun.sh"
          chmod +x "$STAGE_DST/prerun.sh"
          # 01-thermoctl itself has to stay a SUB-stage directory nested
          # one level under the stage dir, not flattened into it --
          # pi-gen's run_stage only descends into STAGE_DIR's immediate
          # subdirectories to find numbered scripts; a 00-run.sh placed
          # directly at the stage level is silently never executed.
          mkdir -p "$STAGE_DST/01-thermoctl"
          cp -r "$STAGE_SRC/01-thermoctl"/* "$STAGE_DST/01-thermoctl/"
          # install.sh itself + image/common/ -- the custom stage's own
          # 00-run.sh chroots in and runs it directly from this copy, so
          # pi-gen's offline chroot does not need network access to this
          # repository at all.
          mkdir -p "$STAGE_DST/01-thermoctl/files/thermoctl-fleet"
          cp -r thermoctl-fleet/image "$STAGE_DST/01-thermoctl/files/thermoctl-fleet/image"
          cp -r thermoctl-fleet/watchdog "$STAGE_DST/01-thermoctl/files/thermoctl-fleet/watchdog"
          # EXPORT_IMAGE marks a stage as the one whose rootfs pi-gen turns
          # into a finished .img at the end of the run (pi-gen's own
          # convention -- an empty marker file is enough). This one stays
          # at the STAGE level, not inside 01-thermoctl/.
          touch "$STAGE_DST/EXPORT_IMAGE"
      - name: Write pi-gen config
        # build-docker.sh (unlike build.sh) does not read these as process
        # environment variables -- it only `source`s a `config` file, either
        # ${DIR}/config or one passed via `-c`. Without that file it fails
        # with `realpath: '': No such file or directory` before ever
        # reaching IMG_NAME/RELEASE/STAGE_LIST, which is exactly what the
        # first real run hit.
        run: |
          cat > pi-gen/config <<'EOF'
          IMG_NAME=thermoctl-base-station
          RELEASE=trixie
          PI_GEN_RELEASE=false
          DEPLOY_COMPRESSION=none
          # Only through our own stage and the two base stages it depends
          # on -- pi-gen's own stage2 is "Raspberry Pi OS Lite", everything
          # from stage3 on (desktop, docs, ...) is explicitly skipped.
          STAGE_LIST="stage0 stage1 stage2 stage-thermoctl"
          EOF
      - name: Build with pi-gen (build-docker.sh)
        run: |
          cd pi-gen
          ./build-docker.sh
      - name: Compress and checksum
        run: |
          set -eu
          cd pi-gen/deploy
          for img in *.img; do
            xz -T0 -9 "$img"
          done
          sha256sum ./*.img.xz > SHA256SUMS
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4.6.2
        with:
          name: thermoctl-base-station-pi
          path: |
            pi-gen/deploy/*.img.xz
            pi-gen/deploy/SHA256SUMS

  # amd64 image (section 19.4): mkosi, not debos.
  #
  # **Why mkosi over debos:** both produce a finished Debian image from a
  # declarative configuration (image/x86/README.md's own "not yet decided"
  # note) -- the actual tie-breaker is systemd. This repository's one
  # bare-metal component (the watchdog) is driven entirely by systemd units
  # (thermoctl-watchdog.service, the restore-mover's .path unit), and mkosi
  # is itself a systemd upstream project, maintained in the systemd
  # repository, with first-class support for the same boot/partition
  # conventions (GPT, discoverable partitions) systemd-boot and
  # systemd-based initrds expect. debos is older, Go-templated, and
  # Debian-packaged, but has no particular alignment with systemd beyond
  # "it can debootstrap a Debian chroot" -- mkosi gets the same result with
  # one declarative `mkosi.conf` instead of a bespoke YAML recipe format,
  # and its `mkosi.postinst.chroot`/`finalize` scripts are plain shell, letting
  # this job call image/common/install.sh completely unchanged.
  #
  # **Not run in this sandbox** (needs a Linux loop-device/systemd-nspawn
  # environment this macOS worktree does not have) -- syntax-checked with
  # actionlint and reviewed against mkosi's own documented CLI instead.
  # Same `workflow_dispatch` addition as build-pi-image above, same reason.
  build-x86-image:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-watchdog-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: thermoctl-fleet
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: watchdog-binaries-amd64
          path: thermoctl-fleet/image/x86/watchdog-bin
      - name: Install Debian's current archive keyring
        # mkosi's debootstrap-equivalent (Debian distribution) runs
        # `apt-get update` against deb.debian.org/security.debian.org for
        # `Release=trixie` using the HOST's `/usr/share/keyrings/
        # debian-archive-keyring.gpg` to verify each repo's `InRelease`.
        # The Ubuntu-runner apt mirror's own `debian-archive-keyring`
        # package (2023.4ubuntu1, a Debian 12-era snapshot) predates
        # trixie's release/security signing keys, so the build failed with
        # `NO_PUBKEY ...` for every one of trixie's repos. Fetching Ubuntu's
        # package wouldn't help (same staleness); instead fetch Debian's
        # own current keyring package directly -- pinned to an exact
        # version and verified against the SHA256 pinned here in the repo
        # (the actual trust anchor) plus, as a plausibility cross-check, the
        # SHA256 trixie's `Packages` index lists for that exact file, then
        # `dpkg -i` the verified file only (never
        # `apt-get install` from an untrusted-at-this-point source, and
        # never `[trusted=yes]`/a disabled signature check).
        run: |
          set -eu
          keyring_version=2025.1
          keyring_sha256=9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac
          keyring_file="debian-archive-keyring_${keyring_version}_all.deb"
          curl -fsSL -o "/tmp/${keyring_file}" \
            "https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/${keyring_file}"
          echo "${keyring_sha256}  /tmp/${keyring_file}" | sha256sum -c -
          # Plausibility cross-check against trixie's Packages index. Note:
          # Packages.gz is fetched over HTTPS but NOT GPG-verified here (only
          # InRelease is signed) -- the repo-pinned SHA256 above is what the
          # trust actually rests on; a mismatch here still aborts the build.
          curl -fsSL "https://deb.debian.org/debian/dists/trixie/main/binary-amd64/Packages.gz" \
            | gunzip -c \
            | awk -v want="${keyring_sha256}" '
                /^Package: debian-archive-keyring$/ { f=1 }
                f && /^SHA256: / { if ($2 != want) { print "SHA256 mismatch with trixie Packages index"; exit 1 } else { print "cross-check OK"; exit 0 } }
              '
          sudo dpkg -i "/tmp/${keyring_file}"
      - name: Install mkosi
        # Pinned to v21 instead of `apt-get install mkosi` -- the
        # Ubuntu-runner apt mirror's mkosi package version floats with the
        # runner image (20.2-1 on the noble image this job currently runs
        # on), and mkosi's own config syntax has changed between major
        # versions (e.g. the `OutputFormat=` setting image/x86/mkosi.conf
        # used to carry does not exist in 20.x). mkosi is not published on
        # PyPI, so pip installs straight from the upstream tag; `[bootable]`
        # pulls in `pefile`, needed for the systemd-boot/UKI path this
        # image's `Bootloader=systemd-boot` setting uses.
        #
        # v20.2 itself hit a real build failure: mkosi's own bundled
        # mkosi-initrd resource config (used internally whenever
        # Bootable=yes builds an initrd) lists a stale package name,
        # `libtss2-mu0`, which trixie's current archive no longer has a
        # candidate for (superseded by `libtss2-mu-4.0.1-0t64`) --
        # `E: Package 'libtss2-mu0' has no installation candidate`. Fixed
        # upstream by commit 7637bcaf ("Update libtss2-mu to use apt
        # search pattern"), first released in v21.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap systemd-container qemu-utils dosfstools \
            systemd-ukify bubblewrap systemd-boot mtools
          # mtools' mcopy populates the ESP (vfat) partition when
          # systemd-repart builds the disk image -- "Could not find mcopy
          # binary." otherwise.
          sudo pip install --break-system-packages \
            "mkosi[bootable] @ git+https://github.com/systemd/mkosi@v21"
          mkosi --version
      - name: Stage repository inputs inside the image
        working-directory: thermoctl-fleet
        run: |
          set -eu
          stage=image/x86/mkosi.extra/opt/thermoctl-build
          mkdir -p "$stage"
          mkdir -p "$stage/image"
          cp -r image/common "$stage/image/"
          cp -r watchdog "$stage/watchdog"
          cp -r image/x86/watchdog-bin "$stage/watchdog-bin"
      - name: Build with mkosi
        working-directory: thermoctl-fleet/image/x86
        # mkosi v21 sandboxes more of its own internal operations (package
        # manager cache sync, etc.) through bubblewrap's unprivileged
        # user-namespace path than v20.2 did, even when mkosi itself runs
        # as root via sudo -- bwrap still calls unshare(CLONE_NEWUSER) and
        # writes its own uid_map, which Ubuntu's AppArmor stack blocks by
        # default on the runner image (`kernel.apparmor_restrict_
        # unprivileged_userns=1`), regardless of the caller's EUID:
        # "bwrap: setting up uid map: Permission denied". This sysctl only
        # affects what this CI job's own build tooling is allowed to do on
        # the runner -- it has no bearing on the shipped image itself
        # (which never creates a user namespace).
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          sudo mkosi --output-dir ../../mkosi-out build
      - name: Compress and checksum
        working-directory: thermoctl-fleet
        run: |
          set -eu
          mkdir -p dist
          img="$(find mkosi-out -maxdepth 1 -name '*.raw' -print -quit)"
          xz -T0 -9 -c "$img" > dist/thermoctl-base-station-x86.img.xz
          cd dist && sha256sum ./*.img.xz > SHA256SUMS
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4.6.2
        with:
          name: thermoctl-base-station-x86
          path: |
            thermoctl-fleet/dist/*.img.xz
            thermoctl-fleet/dist/SHA256SUMS

  # Attaches both .img.xz files plus their checksums to this tag's GitHub
  # release -- "the image version should carry the same number as the
  # watchdog version shipped inside it" (image/README.md, "What is
  # missing"): both now come from the exact same `v*` tag and the exact
  # same build-watchdog-binaries job's output, so there is no separate
  # version number to keep in sync any more -- the tag itself is that
  # number, for the watchdog binaries inside the image and for the image
  # file name alike.
  #
  # Deliberately NOT extended with `|| github.event_name ==
  # 'workflow_dispatch'` the way the three build jobs above were: a manual
  # run exists to confirm a real build works, never to publish a GitHub
  # release asset without a tag. `needs: [build-pi-image, build-x86-image]`
  # alone would not stop that -- this job's own `if:` has to.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-pi-image, build-x86-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: thermoctl-base-station-pi
          path: release/pi/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: thermoctl-base-station-x86
          path: release/x86/
      - name: Merge and verify the two SHA256SUMS files
        run: |
          set -eu
          test -f release/pi/SHA256SUMS
          test -f release/x86/SHA256SUMS
          cat release/pi/SHA256SUMS release/x86/SHA256SUMS > release/SHA256SUMS
          test "$(wc -l < release/SHA256SUMS)" -eq 2
          test "$(awk '{print $2}' release/SHA256SUMS | sort -u | wc -l)" -eq 2
          cp release/pi/*.img.xz release/x86/*.img.xz release/
          cd release
          sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: |
            release/*.img.xz
            release/SHA256SUMS
          fail_on_unmatched_files: true
