name: Abbild
on:
  push:
    paths:
      - "abbild/**"
      - "waechter/thermoctl-waechter.service"
      - "protokoll/anmeldung.py"
      - "tools/pruefe_abbild_konfiguration.py"
      - ".github/workflows/abbild.yml"
  pull_request:
    paths:
      - "abbild/**"
      - "waechter/thermoctl-waechter.service"
      - "protokoll/anmeldung.py"
      - "tools/pruefe_abbild_konfiguration.py"
      - ".github/workflows/abbild.yml"

# Vorerst NUR eine Baubarkeitsprüfung: Konfiguration einlesen, Paketliste
# validieren (abbild/README.md, "Stand dieses Gerüsts"). Kein echter pi-gen-
# oder mkosi/debos-Lauf -- der dauert 30-60 Minuten und gehört laut Auftrag
# nicht in jeden Commit, sondern an die Freigabe (siehe Kommentar unten).
jobs:
  konfiguration-pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # Nur die Basisabhängigkeit (pydantic) noetig -- die Prüfung braucht
      # weder fleet- noch agent-Extras.
      - run: pip install -e .
      - run: python -m tools.pruefe_abbild_konfiguration

