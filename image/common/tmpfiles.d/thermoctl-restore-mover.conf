# systemd-tmpfiles snippet, installed at
# /etc/tmpfiles.d/thermoctl-restore-mover.conf during image preparation
# (section 19.3), mirroring image/common/tmpfiles.d/thermoctl-agent.conf's
# own reasoning for /run/thermoctl-agent. Recreates
# /run/thermoctl-restore-mover fresh on every boot (/run is tmpfs) --
# watchdog/cmd/thermoctl-restore-mover writes its status file
# (status.json) here atomically (temp file plus rename, status.go), so
# this directory has to exist, and be on the same filesystem the rename's
# temp file is created on, before that program's systemd path/service
# units (../../watchdog/cmd/thermoctl-restore-mover/*) ever run --
# systemd-tmpfiles-setup.service runs during early boot, before either of
# those units, for the same reason it already has to run before
# docker.service starts the agent container.
#
# Owner root:root, mode 0755 -- **not** the agent's own uid/gid (10002,
# unlike /run/thermoctl-agent): this directory's only writer is
# thermoctl-restore-mover itself, which runs as root (see that program's
# own .service unit for why: it has to chown the files it moves to an
# arbitrary destination uid, which only root can do). World-readable
# (0755) so the agent container -- which only ever reads this directory,
# read-only, see image/common/agent-compose.yml -- can read the status
# file root wrote into it; the status file itself is additionally written
# mode 0644 by that program (status.go), the same "world-readable status
# file written by a different uid than its reader" pattern
# image/common/tmpfiles.d/thermoctl-agent.conf's own comment already
# describes for /run/thermoctl-agent, just with the root/uid roles
# reversed (there the agent writes, root's systemd units read; here root
# writes, the agent reads).
#
# Type Path                          Mode UID  GID  Age Argument
d      /run/thermoctl-restore-mover  0755 root root -
