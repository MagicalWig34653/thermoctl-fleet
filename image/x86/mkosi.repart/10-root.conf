# Carried forward unchanged from mkosi's own built-in default `10-root.conf`
# -- see `00-esp.conf` next to this file for why this file has to exist at
# all (providing any file under mkosi.repart/ disables mkosi's defaults
# entirely, including the ones this file does not touch).
[Partition]
Type=root
Format=ext4
CopyFiles=/
Minimize=guess
