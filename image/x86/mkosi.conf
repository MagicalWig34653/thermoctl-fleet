# mkosi configuration for the amd64 base station (section 19.4). See
# image/README.md ("Why exactly mkosi over debos" in
# .github/workflows/image.yml) for the tool choice.
#
# Invoked by .github/workflows/image.yml as `mkosi build` from this
# directory. `watchdog-bin/` (the three pre-built, linux/amd64 watchdog
# binaries, placed there by that workflow's build-watchdog-binaries job
# output before this runs) and image/common/install.sh are both reached by
# mkosi.postinst.chroot via /opt/thermoctl-build, copied by mkosi.extra.
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
# `OutputFormat=` does not exist in mkosi 20.x (the version
# .github/workflows/image.yml pins) -- `Format=` alone selects the output
# type (disk/directory/tar/...), see mkosi's own `resources/mkosi.md`.
Format=disk
Output=thermoctl-base-station-x86

[Content]
# `Bootable=` belongs here, not [Output] (mkosi 20.x warns and ignores it
# under [Output]) -- see `resources/mkosi.md`'s own `Bootable=` entry.
Bootable=yes
Bootloader=systemd-boot
# `mkosi.postinst.chroot` (below) runs install.sh, which reaches out to
# Docker's apt repository over HTTPS (fetch-docker-key.sh) and refreshes
# apt's package indices -- postinst/finalize scripts run with networking
# disabled by default (mkosi's own "WithNetwork=" default), which is
# otherwise the right default for build reproducibility but would make
# every one of those steps fail with DNS resolution errors.
WithNetwork=yes
Packages=
    linux-image-amd64
    systemd-boot
    systemd-timesyncd
    # `apt` itself (Debian priority "important", not "essential") --
    # mkosi's own Debian bootstrap only extracts `?essential` packages
    # before running `mkosi.postinst.chroot` below, so without this,
    # `apt-get` does not exist yet inside the rootfs when
    # `image/common/install.sh` tries to use it for Docker's apt
    # repository (`apt-get: command not found`). The finished image also
    # needs apt at runtime for `unattended-upgrades` (image/README.md).
    apt
    ca-certificates
    # fetch-docker-key.sh (image/common/apt/) hard-requires both of these
    # on PATH before it will even try the fetch.
    curl
    gnupg

# `mkosi.postinst.chroot` (next to this file) runs automatically inside
# the finished rootfs before the image is sealed, so `/` already is
# that rootfs -- the exact same install.sh every other build/test path in
# this repository uses (image/pi/, tools/mac-test-vm/), called the same
# way (`--root /`) as it is inside the Lima test VM.
