<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="thermoctl-fleet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fa8f40" />
      <stop offset="1" stop-color="#21609b" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)" />

  <!-- Flat, simplified version of branding/thermoctl-fleet.icon: a house
       with a thermometer inside and a small flame at the roof apex, plus
       a thin fleet arc below. No glass/translucency, just flat shapes,
       for use as a scalable favicon. -->
