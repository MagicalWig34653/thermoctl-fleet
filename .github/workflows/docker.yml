name: Docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  # Zwei Abbilder aus einem Repository (README.md, "Ein Repository, zwei
  # Abbilder") -- eine Matrix statt zweier fast identischer Jobs.
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: thermoctl-fleet
            dockerfile: docker/Dockerfile.fleet
          - name: thermoctl-agent
            dockerfile: docker/Dockerfile.agent
    steps:
      - uses: actions/checkout@v4
      # Für linux/arm64 auf dem amd64-Läufer: buildx allein baut nur für die
      # Architektur des Läufers, QEMU emuliert die fremde Architektur beim Bauen.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Kein Login und kein push bei Pull Requests -- die Bauprobe läuft trotzdem,
      # nur ohne Veröffentlichung nach ghcr.io.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: marken
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/magicalwig34653/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest entsteht ausschließlich aus einem Tag v*, nie aus einem Push auf
            # main oder aus einem Pull Request -- wie in thermoctl/docker.yml
            # begründet: das Abbild ist der Rückfallpunkt, wenn ein Update schiefgeht.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # amd64 und arm64 -- dieselben Zielarchitekturen wie thermoctl
          # (Raspberry Pi 4/5 für den Melder, x86_64-Server für die Cloud).
          # armv7 ausdrücklich nicht.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.marken.outputs.tags }}
          labels: ${{ steps.marken.outputs.labels }}
