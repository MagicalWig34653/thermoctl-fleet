name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # No database service: the scaffold stores nothing (see docs/STATUS.md). Once
  # storage exists, add it here -- following the same pattern as thermoctl's
  # ci.yml (sqlite/mariadb matrix, THERMOCTL_TEST_DATABASE_URL equivalent).
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,fleet,agent]"
      - run: ruff check .
      # watchdog/ has been a Go module since section 18.3, not part of this
      # Python check -- its own CI track in go.yml (section 18.3, "the
      # existing Python track stays as it is").
      - run: mypy protocol fleet agent tools
      # Includes tests/test_watchdog_contract.py (the Python side of the
      # contract, section 18.3) and tests/test_image_config.py (section 19).
      - run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.fleet .
      - run: docker build -f docker/Dockerfile.agent .
