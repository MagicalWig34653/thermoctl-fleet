<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 3x3 window grid. Eight calm white/translucent windows, one glowing
       warm orange in the exact centre, the apartment that needs
       attention. Sits under the glass facade so the glow reads through
       the translucency. -->
  <g>
    <rect x="356" y="364" width="80" height="80" rx="16" fill="#ffffff" fill-opacity="0.55" />
    <rect x="472" y="364" width="80" height="80" rx="16" fill="#ffffff" fill-opacity="0.55" />
    <rect x="588" y="364" width="80" height="80" rx="16" fill="#ffffff" fill-opacity="0.55" />
    <rect x="356" y="480" width="80" height="80" rx="16" fill="#ffffff" fill-opacity="0.55" />
    <rect x="472" y="480" width="80" height="80" rx="16" fill="#ffb24d" fill-opacity="0.95" />
    <rect x="588" y="480" width="80" height="80" rx="16" fill="#ffffff" fill-opacity="0.55" />
    <rect x="356" y="596" width="80" height="80" rx="16" fill="#ffffff" fill-opacity="0.55" />
    <rect x="472" y="596" width="80" height="80" rx="16" fill="#ffffff" fill-opacity="0.55" />
    <rect x="588" y="596" width="80" height="80" rx="16" fill="#ffffff" fill-opacity="0.55" />
  </g>
</svg>
