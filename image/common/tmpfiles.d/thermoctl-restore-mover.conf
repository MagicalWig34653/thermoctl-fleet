# systemd-tmpfiles snippet, installed at
# /etc/tmpfiles.d/thermoctl-restore-mover.conf during image preparation
# (section 19.3). Ensures /var/lib/thermoctl-restore-mover exists, with
# the right ownership/mode, on every boot -- watchdog/cmd/thermoctl-restore-mover
# writes both its status file (status.json, status.go) and, since P5.5d,
# its own pre-rename journal (journal.json, journal.go) here, atomically
# (temp file plus rename), so this directory has to exist, and be on the
# same filesystem those renames' temp files are created on, before that
# program's systemd path/service units
# (../../watchdog/cmd/thermoctl-restore-mover/*) ever run --
# systemd-tmpfiles-setup.service runs during early boot, before either of
# those units, for the same reason it already has to run before
# docker.service starts the agent container.
#
# **Persistent (/var/lib), not /run (P5.5d, moved from where this
# directory lived when it held only the status file):** P5.5d's own
# journal has to survive this program's own process exiting -- a tmpfs
# directory wiped on every reboot would silently drop the one record a
# later run needs to safely resume an interrupted finalize (a live store
# left non-empty by a partial finalize, re-verified byte for byte against
# the journal before this program will touch it again -- see journal.go's
# own top docstring). The status file moved alongside the journal for the
# same "one directory, one ReadWritePaths= entry in the .service unit"
# reasoning (thermoctl-restore-mover.service's own comment) -- nothing
# about the status file ever needed tmpfs semantics in the first place,
# unlike /run/thermoctl-agent's health report (which specifically must
# not survive to cover for a freshly started, not-yet-healthy agent, see
# thermoctl-agent.conf below); `d` (rather than `D`/`r`) also means this
# tmpfiles.d entry only ever *ensures* the directory exists with the
# right mode/ownership on a persistent filesystem, it never empties or
# recreates it, so a real journal/status file already on disk from a
# previous boot survives this entry running again.
#
# Owner root:root, mode 0755 -- **not** the agent's own uid/gid (10002,
# unlike /run/thermoctl-agent): this directory's only writer is
# thermoctl-restore-mover itself, which runs as root (see that program's
# own .service unit for why: it has to chown the files it moves to an
# arbitrary destination uid, which only root can do). World-readable
# (0755) so the agent container -- which only ever reads the status file
# in this directory, read-only, see image/common/agent-compose.yml -- can
# read what root wrote into it; the status file itself is additionally
# written mode 0644 by that program (status.go), the same
# "world-readable status file written by a different uid than its
# reader" pattern image/common/tmpfiles.d/thermoctl-agent.conf's own
# comment already describes for /run/thermoctl-agent, just with the
# root/uid roles reversed (there the agent writes, root's systemd units
# read; here root writes, the agent reads). The journal (journal.json)
# is written mode 0600 by that same program -- the agent container never
# reads it at all (it has no business knowing this program's own
# pre-rename bookkeeping), so it stays root-only despite living in an
# otherwise world-readable directory.
#
# Type Path                             Mode UID  GID  Age Argument
d      /var/lib/thermoctl-restore-mover 0755 root root -
